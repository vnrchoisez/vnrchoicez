<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VNR Choicez</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #111;
        }

        header {
            background: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
            color: #666;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 15px;
            padding: 15px;
        }

        .product img {
            width: 100%;
            border-radius: 10px;
        }

        .product h3 {
            margin-bottom: 5px;
        }

        .product p {
            color: #666;
        }

        .button {
            display: block;
            text-align: center;
            background: #111;
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>VNR CHOICEZ</h1>
        <p>My favourite Shopee finds 🛒</p>
    </header>

    <main class="container">

        <h2 class="section-title">🔥 Trending Finds</h2>

        <div class="products">

            <div class="product">
                <img src="https://via.placeholder.com/500" alt="Product">

                <h3>Product Name</h3>

                <p>Short description of the product.</p>

                <a href="#" class="button">
                    View on Shopee →
                </a>
            </div>

            <div class="product">
                <img src="https://via.placeholder.com/500" alt="Product">

                <h3>Another Product</h3>

                <p>Short description of the product.</p>

                <a href="#" class="button">
                    View on Shopee →
                </a>
            </div>

        </div>

    </main>

    <footer>
        © 2026 VNR Choicez
    </footer>

</body>
</html>
