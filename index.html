    <script>

        /* =========================================================
           SUPABASE
           ========================================================= */

        const SUPABASE_URL =
            "https://YOUR-PROJECT.supabase.co";

        const SUPABASE_ANON_KEY =
            "YOUR-ANON-KEY";


        let supabaseClient = null;


        if (
            typeof window.supabase !== "undefined" &&
            SUPABASE_URL &&
            SUPABASE_ANON_KEY &&
            !SUPABASE_URL.includes("YOUR-PROJECT")
        ) {

            supabaseClient =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_ANON_KEY
                );

        }


        /* =========================================================
           DOM
           ========================================================= */

        const productsContainer =
            document.getElementById(
                "productsContainer"
            );


        const sectionHeading =
            document.getElementById(
                "sectionHeading"
            );


        const sectionSubheading =
            document.getElementById(
                "sectionSubheading"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const categoryWrapper =
            document.getElementById(
                "categoryWrapper"
            );


        const categoryToggle =
            document.getElementById(
                "categoryToggle"
            );


        const categoryMenu =
            document.getElementById(
                "categoryMenu"
            );


        const mobileMenuBtn =
            document.getElementById(
                "mobileMenuBtn"
            );


        const mainNav =
            document.getElementById(
                "mainNav"
            );


        const siteHeader =
            document.getElementById(
                "siteHeader"
            );


        const filterButton =
            document.getElementById(
                "filterButton"
            );


        const filterMenu =
            document.getElementById(
                "filterMenu"
            );


        /* =========================================================
           STATE
           ========================================================= */

        let allProducts = [];

        let allCategories = [];

        let currentFilter =
            "all";

        let currentSearch =
            "";

        let currentSort =
            "default";

        let currentPlatform =
            "all";


        /* =========================================================
           URL PARAMETER
           ========================================================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const initialType =
            urlParams.get(
                "type"
            );


        /* =========================================================
           HELPERS
           ========================================================= */

        function escapeHTML(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function formatPrice(price) {

            if (
                price === null ||
                price === undefined ||
                price === ""
            ) {

                return "";

            }


            const numericPrice =
                Number(price);


            if (
                Number.isNaN(
                    numericPrice
                )
            ) {

                return escapeHTML(
                    price
                );

            }


            return `RM ${numericPrice.toFixed(2)}`;

        }


        function formatPriceRange(prices) {

            const validPrices =
                prices

                    .map(
                        function (price) {

                            const numericPrice =
                                Number(price);


                            return Number.isFinite(
                                numericPrice
                            )
                                ? numericPrice
                                : null;

                        }
                    )

                    .filter(
                        function (price) {

                            return price !== null;

                        }
                    );


            if (
                !validPrices.length
            ) {

                return "";

            }


            const lowestPrice =
                Math.min(
                    ...validPrices
                );


            const highestPrice =
                Math.max(
                    ...validPrices
                );


            if (
                lowestPrice ===
                highestPrice
            ) {

                return formatPrice(
                    lowestPrice
                );

            }


            return (
                `${formatPrice(lowestPrice)} – ` +
                `${formatPrice(highestPrice)}`
            );

        }


        function getProductName(
            product
        ) {

            return (
                product.name ||
                product.product_name ||
                product.title ||
                "Untitled Product"
            );

        }


        function getProductDescription(
            product
        ) {

            return (
                product.description ||
                product.product_description ||
                ""
            );

        }


        function getProductImage(
            product
        ) {

            return (
                product.image_url ||
                product.image ||
                product.product_image ||
                "cropped_circle_image.png"
            );

        }


        function getProductCategory(
            product
        ) {

            return (
                product.category ||
                product.category_name ||
                product.product_category ||
                ""
            );

        }


        function getActiveProductPlatforms(
            product
        ) {

            if (
                !Array.isArray(
                    product.platforms
                )
            ) {

                return [];

            }


            return product.platforms.filter(
                function (platform) {

                    return (
                        platform &&
                        platform.is_active === true &&
                        platform.affiliate_url
                    );

                }
            );

        }


        /* =========================================================
           GET PRODUCT PRICE RANGE
           MAIN PRICE + ACTIVE PLATFORM PRICES
           ========================================================= */

        function getProductPriceRange(
            product,
            activePlatforms
        ) {

            const prices = [];


            /*
             * Main/base product price.
             */

            if (
                product.price !== null &&
                product.price !== undefined &&
                product.price !== ""
            ) {

                const mainPrice =
                    Number(product.price);


                if (
                    Number.isFinite(
                        mainPrice
                    )
                ) {

                    prices.push(
                        mainPrice
                    );

                }

            }


            /*
             * Active platform prices only.
             */

            activePlatforms.forEach(
                function (platform) {

                    if (
                        platform.price !== null &&
                        platform.price !== undefined &&
                        platform.price !== ""
                    ) {

                        const platformPrice =
                            Number(platform.price);


                        if (
                            Number.isFinite(
                                platformPrice
                            )
                        ) {

                            prices.push(
                                platformPrice
                            );

                        }

                    }

                }
            );


            return formatPriceRange(
                prices
            );

        }


        /* =========================================================
           HEADER SCROLL EFFECT
           ========================================================= */

        function handleHeaderScroll() {

            if (
                window.scrollY > 15
            ) {

                siteHeader.classList.add(
                    "scrolled"
                );

            } else {

                siteHeader.classList.remove(
                    "scrolled"
                );

            }

        }


        window.addEventListener(
            "scroll",
            handleHeaderScroll,
            {
                passive: true
            }
        );


        handleHeaderScroll();


        /* =========================================================
           MOBILE MENU
           ========================================================= */

        mobileMenuBtn.addEventListener(
            "click",
            function () {

                const isOpen =
                    mainNav.classList.toggle(
                        "mobile-open"
                    );


                mobileMenuBtn.classList.toggle(
                    "active",
                    isOpen
                );


                mobileMenuBtn.setAttribute(
                    "aria-expanded",
                    String(isOpen)
                );

            }
        );


        /* =========================================================
           CATEGORY DISPLAY ORDER / COMPATIBILITY
           ========================================================= */

        const CATEGORY_DEFINITIONS = [

            {
                display:
                    "Fashion",

                values:
                    [
                        "Fashion"
                    ]
            },


            {
                display:
                    "Accessories",

                values:
                    [
                        "Accessories"
                    ]
            },


            {
                display:
                    "Beauty",

                values:
                    [
                        "Beauty"
                    ]
            },


            {
                display:
                    "Fragrance",

                values:
                    [
                        "Fragrance"
                    ]
            },


            {
                display:
                    "Home Items",

                values:
                    [
                        "Home Items"
                    ]
            },


            {
                display:
                    "Cookery",

                values:
                    [
                        "Cookery"
                    ]
            },


            {
                display:
                    "Electronics",

                values:
                    [
                        "Electronics",
                        "Gadget & Tech"
                    ]
            },


            {
                display:
                    "Gaming",

                values:
                    [
                        "Gaming"
                    ]
            },


            {
                display:
                    "Sports",

                values:
                    [
                        "Sports"
                    ]
            },


            {
                display:
                    "Others",

                values:
                    [
                        "Others",
                        "Random Useful Items"
                    ]
            }

        ];


        function getCategoryDefinition(
            categoryName
        ) {

            const name =
                String(
                    categoryName || ""
                )
                    .toLowerCase()
                    .trim();


            return CATEGORY_DEFINITIONS.find(
                function (definition) {

                    return definition.values.some(
                        function (value) {

                            return (
                                value.toLowerCase() ===
                                name
                            );

                        }
                    );

                }
            ) || null;

        }


        /* =========================================================
           LOAD CATEGORIES
           ========================================================= */

        async function loadCategories() {

            const fallbackCategories =
                CATEGORY_DEFINITIONS.map(
                    function (definition) {

                        return definition.display;

                    }
                );


            try {

                if (
                    !supabaseClient
                ) {

                    allCategories =
                        fallbackCategories;

                    renderCategories();

                    return;

                }


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("categories")
                        .select("*")
                        .order(
                            "name",
                            {
                                ascending:
                                    true
                            }
                        );


                if (
                    error
                ) {

                    throw error;

                }


                if (
                    Array.isArray(data) &&
                    data.length
                ) {

                    const databaseCategories =
                        data
                            .map(
                                category =>
                                    category.name ||
                                    category.category_name
                            )
                            .filter(
                                Boolean
                            );


                    allCategories =
                        CATEGORY_DEFINITIONS

                            .filter(
                                function (
                                    definition
                                ) {

                                    return definition.values.some(
                                        function (
                                            value
                                        ) {

                                            return databaseCategories.some(
                                                function (
                                                    databaseCategory
                                                ) {

                                                    return (
                                                        String(
                                                            databaseCategory
                                                        )
                                                            .toLowerCase()
                                                            .trim() ===
                                                        value.toLowerCase()
                                                    );

                                                }
                                            );

                                        }
                                    );

                                }
                            )

                            .map(
                                function (
                                    definition
                                ) {

                                    return definition.display;

                                }
                            );


                    if (
                        !allCategories.length
                    ) {

                        allCategories =
                            fallbackCategories;

                    }

                } else {

                    allCategories =
                        fallbackCategories;

                }

            } catch (error) {

                console.warn(
                    "Could not load categories:",
                    error
                );


                allCategories =
                    fallbackCategories;

            }


            renderCategories();

        }


        /* =========================================================
           RENDER CATEGORY MENU
           ========================================================= */

        function renderCategories() {

            categoryMenu.innerHTML =
                "";


            const allLink =
                document.createElement(
                    "a"
                );


            allLink.href =
                "index.html";


            allLink.textContent =
                "All Products";


            allLink.addEventListener(
                "click",
                function () {

                    categoryWrapper.classList.remove(
                        "open"
                    );


                    categoryToggle.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }
            );


            categoryMenu.appendChild(
                allLink
            );


            allCategories.forEach(
                function (category) {

                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        `?type=${encodeURIComponent(
                            category
                        )}`;


                    link.textContent =
                        category;


                    link.addEventListener(
                        "click",
                        function () {

                            categoryWrapper.classList.remove(
                                "open"
                            );


                            categoryToggle.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                        }
                    );


                    categoryMenu.appendChild(
                        link
                    );

                }
            );

        }


        /* =========================================================
           LOAD PRODUCTS
           ========================================================= */

        async function loadProducts() {

            if (
                !supabaseClient
            ) {

                productsContainer.innerHTML = `
                    <div class="empty-state">
                        Unable to connect to the product database.
                    </div>
                `;

                return;

            }


            productsContainer.innerHTML = `
                <div class="loading">
                    Loading products
                </div>
            `;


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("products")
                        .select("*");


                if (
                    error
                ) {

                    throw error;

                }


                allProducts =
                    Array.isArray(data)
                        ? data
                        : [];


                renderProducts();

            } catch (error) {

                console.error(
                    "VNR CHOICEZ: Unable to load products.",
                    error
                );


                productsContainer.innerHTML = `
                    <div class="error-message">
                        Unable to load products.
                    </div>
                `;

            }

        }


        /* =========================================================
           GET SORT PRICE
           ========================================================= */

        function getProductSortPrice(
            product
        ) {

            const prices = [];


            const mainPrice =
                Number(
                    product.price
                );


            if (
                Number.isFinite(
                    mainPrice
                )
            ) {

                prices.push(
                    mainPrice
                );

            }


            getActiveProductPlatforms(
                product
            ).forEach(
                function (platform) {

                    const platformPrice =
                        Number(
                            platform.price
                        );


                    if (
                        Number.isFinite(
                            platformPrice
                        )
                    ) {

                        prices.push(
                            platformPrice
                        );

                    }

                }
            );


            return prices.length
                ? Math.min(
                    ...prices
                )
                : null;

        }


        /* =========================================================
           FILTER PRODUCTS
           ========================================================= */

        function getFilteredProducts() {

            let products =
                [
                    ...allProducts
                ];


            /* CATEGORY */

            if (
                currentFilter &&
                currentFilter !== "all"
            ) {

                if (
                    currentFilter
                        .toLowerCase() ===
                    "🔥trending"
                ) {

                    products =
                        products.filter(
                            product =>
                                product.trending === true ||
                                product.is_trending === true
                        );

                } else {

                    products =
                        products.filter(
                            function (product) {

                                const category =
                                    getProductCategory(
                                        product
                                    );


                                const definition =
                                    getCategoryDefinition(
                                        currentFilter
                                    );


                                if (
                                    !category
                                ) {

                                    return false;

                                }


                                if (
                                    definition
                                ) {

                                    return definition.values.some(
                                        function (
                                            value
                                        ) {

                                            return (
                                                category
                                                    .toLowerCase()
                                                    .trim() ===
                                                value
                                                    .toLowerCase()
                                                    .trim()
                                            );

                                        }
                                    );

                                }


                                return (
                                    category
                                        .toLowerCase()
                                        .trim() ===
                                    currentFilter
                                        .toLowerCase()
                                        .trim()
                                );

                            }
                        );

                }

            }


            /* SEARCH */

            if (
                currentSearch
            ) {

                const query =
                    currentSearch
                        .toLowerCase()
                        .trim();


                products =
                    products.filter(
                        function (product) {

                            const name =
                                getProductName(
                                    product
                                ).toLowerCase();


                            const description =
                                getProductDescription(
                                    product
                                ).toLowerCase();


                            const category =
                                getProductCategory(
                                    product
                                ).toLowerCase();


                            return (
                                name.includes(
                                    query
                                ) ||

                                description.includes(
                                    query
                                ) ||

                                category.includes(
                                    query
                                )
                            );

                        }
                    );

            }


            /* PLATFORM */

            if (
                currentPlatform !==
                "all"
            ) {

                products =
                    products.filter(
                        function (product) {

                            return getActiveProductPlatforms(
                                product
                            ).some(
                                function (
                                    platform
                                ) {

                                    return (
                                        String(
                                            platform.platform ||
                                            ""
                                        )
                                            .toLowerCase()
                                            .trim() ===
                                        currentPlatform
                                            .toLowerCase()
                                            .trim()
                                    );

                                }
                            );

                        }
                    );

            }


            /* SORT BY PRICE */

            if (
                currentSort !==
                "default"
            ) {

                products.sort(
                    function (
                        a,
                        b
                    ) {

                        const priceA =
                            getProductSortPrice(
                                a
                            );


                        const priceB =
                            getProductSortPrice(
                                b
                            );


                        if (
                            priceA === null &&
                            priceB === null
                        ) {

                            return 0;

                        }


                        if (
                            priceA === null
                        ) {

                            return 1;

                        }


                        if (
                            priceB === null
                        ) {

                            return -1;

                        }


                        return (
                            currentSort ===
                            "low"
                        )
                            ? priceA - priceB
                            : priceB - priceA;

                    }
                );

            }


            return products;

        }


        /* =========================================================
           UPDATE SECTION TITLE
           ========================================================= */

        function updateSectionTitle() {

            if (
                currentFilter &&
                currentFilter.toLowerCase() ===
                "trending"
            ) {

                sectionHeading.textContent =
                    "Trending";


                sectionSubheading.textContent =
                    "Popular picks from VNR CHOICEZ";


                return;

            }


            if (
                currentFilter &&
                currentFilter !== "all"
            ) {

                sectionHeading.textContent =
                    currentFilter;


                sectionSubheading.textContent =
                    "Curated picks by VNR CHOICEZ";


                return;

            }


            sectionHeading.textContent =
                "All Products";


            sectionSubheading.textContent =
                "Curated picks by VNR CHOICEZ";

        }


        /* =========================================================
           RENDER PRODUCTS
           ========================================================= */

        function renderProducts() {

            updateSectionTitle();


            const products =
                getFilteredProducts();


            if (
                !products.length
            ) {

                productsContainer.innerHTML = `
                    <div
                        class="empty-state"
                        style="grid-column: 1 / -1;"
                    >
                        No products found.
                    </div>
                `;

                return;

            }


            productsContainer.innerHTML =
                "";


            products.forEach(
                function (
                    product,
                    index
                ) {

                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "product";


                    card.style.setProperty(
                        "--delay",
                        `${Math.min(
                            index * 65,
                            650
                        )}ms`
                    );


                    const image =
                        escapeHTML(
                            getProductImage(
                                product
                            )
                        );


                    const name =
                        escapeHTML(
                            getProductName(
                                product
                            )
                        );


                    const description =
                        escapeHTML(
                            getProductDescription(
                                product
                            )
                        );


                    const category =
                        escapeHTML(
                            getProductCategory(
                                product
                            )
                        );


                    const activePlatforms =
                        getActiveProductPlatforms(
                            product
                        );


                    const priceRange =
                        getProductPriceRange(
                            product,
                            activePlatforms
                        );


                    let platformHTML =
                        "";


                    if (
                        activePlatforms.length
                    ) {

                        platformHTML = `
                            <div class="product-platforms">

                                ${
                                    activePlatforms
                                        .map(
                                            function (
                                                platform
                                            ) {

                                                const platformName =
                                                    escapeHTML(
                                                        platform.platform ||
                                                        "View Product"
                                                    );


                                                const platformURL =
                                                    escapeHTML(
                                                        platform.affiliate_url ||
                                                        "#"
                                                    );


                                                const platformPrice =
                                                    formatPrice(
                                                        platform.price
                                                    );


                                                return `
                                                    <a
                                                        class="platform-button"
                                                        href="${platformURL}"
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        data-product-id="${escapeHTML(
                                                            product.id || ""
                                                        )}"
                                                    >

                                                        <span class="platform-name">
                                                            ${platformName}
                                                        </span>

                                                        <span class="platform-price">
                                                            ${
                                                                platformPrice ||
                                                                "View"
                                                            }
                                                        </span>

                                                    </a>
                                                `;

                                            }
                                        )
                                        .join("")
                                }

                            </div>
                        `;

                    }


                    card.innerHTML = `

                        <div class="product-image-wrap">

                            <img
                                class="product-image"
                                src="${image}"
                                alt="${name}"
                                loading="lazy"
                            >

                        </div>


                        <div class="product-body">

                            <h3 class="product-name">
                                ${name}
                            </h3>


                            ${
                                description
                                    ? `
                                        <p class="product-description">
                                            ${description}
                                        </p>
                                    `
                                    : ""
                            }


                            ${
                                priceRange
                                    ? `
                                        <div class="product-price">
                                            ${priceRange}
                                        </div>
                                    `
                                    : ""
                            }


                            ${platformHTML}


                            <div class="product-footer">

                                <span class="product-category">
                                    ${category}
                                </span>


                                <span class="view-product">
                                    View
                                    <span>
                                        →
                                    </span>
                                </span>

                            </div>

                        </div>

                    `;


                    card
                        .querySelectorAll(
                            "[data-product-id]"
                        )
                        .forEach(
                            function (link) {

                                link.addEventListener(
                                    "click",
                                    function () {

                                        trackClick(
                                            product.id
                                        );

                                    }
                                );

                            }
                        );


                    productsContainer.appendChild(
                        card
                    );

                }
            );

        }


        /* =========================================================
           CLICK TRACKING
           ========================================================= */

        async function trackClick(
            productId
        ) {

            if (
                !supabaseClient ||
                !productId
            ) {

                return;

            }


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from("products")
                        .select("clicks")
                        .eq(
                            "id",
                            productId
                        )
                        .single();


                if (
                    error
                ) {

                    console.warn(
                        "VNR CHOICEZ: Unable to read click count.",
                        error
                    );


                    return;

                }


                const currentClicks =
                    Number(
                        data?.clicks ||
                        0
                    );


                await supabaseClient
                    .from("products")
                    .update(
                        {
                            clicks:
                                currentClicks + 1
                        }
                    )
                    .eq(
                        "id",
                        productId
                    );

            } catch (
                error
            ) {

                console.warn(
                    "VNR CHOICEZ: Click tracking failed.",
                    error
                );

            }

        }


        /* =========================================================
           FILTER MENU
           ========================================================= */

        function closeFilterMenu() {

            filterMenu.classList.remove(
                "open"
            );


            filterButton.setAttribute(
                "aria-expanded",
                "false"
            );


            filterMenu.setAttribute(
                "aria-hidden",
                "true"
            );

        }


        filterButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                const isOpen =
                    filterMenu.classList.toggle(
                        "open"
                    );


                filterButton.setAttribute(
                    "aria-expanded",
                    String(isOpen)
                );


                filterMenu.setAttribute(
                    "aria-hidden",
                    String(!isOpen)
                );

            }
        );


        filterMenu.addEventListener(
            "click",
            function (event) {

                const option =
                    event.target.closest(
                        ".filter-option"
                    );


                if (
                    !option
                ) {

                    return;

                }


                if (
                    option.dataset.sort
                ) {

                    currentSort =
                        option.dataset.sort;

                }


                if (
                    option.dataset.platform
                ) {

                    currentPlatform =
                        option.dataset.platform;

                }


                filterMenu
                    .querySelectorAll(
                        '.filter-option[data-sort]'
                    )
                    .forEach(
                        function (item) {

                            item.classList.toggle(
                                "active",
                                item.dataset.sort ===
                                currentSort
                            );

                        }
                    );


                filterMenu
                    .querySelectorAll(
                        '.filter-option[data-platform]'
                    )
                    .forEach(
                        function (item) {

                            item.classList.toggle(
                                "active",
                                item.dataset.platform ===
                                currentPlatform
                            );

                        }
                    );


                closeFilterMenu();


                renderProducts();

            }
        );


        document.addEventListener(
            "click",
            function (event) {

                if (
                    !event.target.closest(
                        ".search-box"
                    )
                ) {

                    closeFilterMenu();

                }

            }
        );


        /* =========================================================
           SEARCH
           ========================================================= */

        let searchTimeout;


        searchInput.addEventListener(
            "input",
            function () {

                clearTimeout(
                    searchTimeout
                );


                currentSearch =
                    this.value;


                /*
                 * Tiny debounce so typing feels smooth
                 * and does not constantly rebuild the grid.
                 */

                searchTimeout =
                    setTimeout(
                        function () {

                            renderProducts();

                        },
                        120
                    );

            }
        );


        /* =========================================================
           CATEGORY DROPDOWN
           ========================================================= */

        categoryToggle.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                const isOpen =
                    categoryWrapper.classList.toggle(
                        "open"
                    );


                categoryToggle.setAttribute(
                    "aria-expanded",
                    String(isOpen)
                );

            }
        );


        document.addEventListener(
            "click",
            function (event) {

                if (
                    !categoryWrapper.contains(
                        event.target
                    )
                ) {

                    categoryWrapper.classList.remove(
                        "open"
                    );


                    categoryToggle.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }

            }
        );


        document.querySelectorAll(
            ".dropdown-menu a"
        ).forEach(
            function (link) {

                link.addEventListener(
                    "click",
                    function () {

                        categoryWrapper.classList.remove(
                            "open"
                        );


                        categoryToggle.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }
                );

            }
        );


        /* =========================================================
           DETECT INITIAL FILTER
           ========================================================= */

        function applyInitialFilter() {

            if (
                !initialType
            ) {

                currentFilter =
                    "all";


                document.body.classList.remove(
                    "has-filter"
                );


                return;

            }


            currentFilter =
                decodeURIComponent(
                    initialType
                );


            document.body.classList.add(
                "has-filter"
            );

        }


        /* =========================================================
           IMAGE PRELOAD / ERROR HANDLING
           ========================================================= */

        document.addEventListener(
            "error",
            function (event) {

                if (
                    event.target &&
                    event.target.tagName ===
                    "IMG"
                ) {

                    if (
                        event.target.dataset
                            .fallbackApplied
                    ) {

                        return;

                    }


                    event.target.dataset
                        .fallbackApplied =
                        "true";


                    event.target.src =
                        "cropped_circle_image.png";

                }

            },
            true
        );


        /* =========================================================
           INITIALIZE
           ========================================================= */

        async function initializeSite() {

            applyInitialFilter();


            await loadCategories();


            await loadProducts();

        }


        initializeSite();

    </script>


</body>
