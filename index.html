<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VNR CHOICEZ</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f6f6;
            color: #171717;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 42px 20px 38px;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 15px;
            color: #d6d6d6;
        }

        nav {
            background: white;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 14px 15px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        nav::-webkit-scrollbar {
            display: none;
        }

        nav a {
            text-decoration: none;
            color: #171717;
            font-size: 14px;
            font-weight: 600;
            padding: 9px 15px;
            border: 1px solid #dedede;
            border-radius: 999px;
            background: white;
            transition: 0.2s ease;
        }

        nav a:hover {
            background: #171717;
            color: white;
            border-color: #171717;
        }

        .search-container {
            max-width: 850px;
            margin: 28px auto 0;
            padding: 0 20px;
        }

        #searchInput {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #dcdcdc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        #searchInput:focus {
            border-color: #999;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .section-title {
            font-size: 28px;
            margin: 0 0 24px;
            font-weight: 800;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product {
            background: white;
            border: 1px solid #e7e7e7;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            display: block;
            padding: 5px;
            background: white;
        }

        .product-info {
            padding: 16px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 8px;
            line-height: 1.35;
        }

        .product-description {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .product-category {
            display: inline-block;
            font-size: 11px;
            color: #666;
            background: #f1f1f1;
            padding: 5px 8px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .buy-button {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background: #111;
            color: white;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .buy-button:hover {
            background: #333;
        }

        #loading {
            text-align: center;
            color: #777;
            padding: 50px 10px;
            font-size: 15px;
        }

        #errorMessage {
            display: none;
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            color: #777;
            line-height: 1.6;
        }

        #noResults {
            display: none;
            text-align: center;
            color: #777;
            padding: 40px 10px;
            font-size: 15px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        footer .footer-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        footer .footer-text {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }

        @media (max-width: 1000px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            header {
                padding: 32px 15px 30px;
            }

            .logo {
                font-size: 32px;
            }

            .tagline {
                font-size: 13px;
            }

            nav {
                justify-content: flex-start;
            }

            .container {
                padding: 28px 12px 50px;
            }

            .section-title {
                font-size: 24px;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .product {
                border-radius: 9px;
            }

            .product-image {
                padding: 3px;
            }

            .product-info {
                padding: 12px;
            }

            .product-name {
                font-size: 14px;
            }

            .product-description {
                font-size: 12px;
            }

            .product-price {
                font-size: 16px;
            }

            .buy-button {
                font-size: 13px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">VNR CHOICEZ</div>

    <div class="tagline">
        Things worth knowing. Things worth buying.
    </div>
</header>

<nav id="categoryNav">
    <a href="index.html">Home</a>
    <a href="category.html?type=Trending">Trending</a>
</nav>

<div class="search-container">
    <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
        autocomplete="off"
    >
</div>

<main class="container">

    <h2 class="section-title">
        🏠 Home
    </h2>

    <div id="loading">
        Loading products...
    </div>

    <div id="errorMessage">
        Unable to load products right now.
        Please refresh the page.
    </div>

    <div
        class="product-grid"
        id="productGrid"
    ></div>

    <div id="noResults">
        No products found.
    </div>

</main>

<footer>

    <div class="footer-title">
        @2026 VNR CHOICEZ
    </div>

    <div class="footer-text">
        Things worth knowing. Things worth buying.
    </div>

    <div class="footer-text">
        Curated finds, useful products, and things worth sharing.
    </div>

</footer>


<script>

"use strict";


/* =========================================================
   SUPABASE CHECK
========================================================= */

if (
    typeof window.supabase === "undefined" ||
    typeof supabase === "undefined"
) {

    console.error(
        "VNR CHOICEZ ERROR: Supabase library/config.js failed to load."
    );

    document.getElementById("loading").style.display = "none";

    document.getElementById("errorMessage").style.display = "block";

    throw new Error(
        "Supabase is not available."
    );
}


/* =========================================================
   ELEMENTS
========================================================= */

const productGrid =
    document.getElementById("productGrid");

const searchInput =
    document.getElementById("searchInput");

const loading =
    document.getElementById("loading");

const errorMessage =
    document.getElementById("errorMessage");

const noResults =
    document.getElementById("noResults");

const categoryNav =
    document.getElementById("categoryNav");


/* =========================================================
   DEFAULT VNR CHOICEZ CATEGORIES

   These are fallback categories.
   Supabase categories will replace them
   automatically if available.
========================================================= */

const DEFAULT_CATEGORIES = [

    {
        name: "Gadget & Tech",
        slug: "gadgets-tech"
    },

    {
        name: "Accessories",
        slug: "accessories"
    },

    {
        name: "Fashion",
        slug: "fashion"
    },

    {
        name: "Cookery",
        slug: "cookery"
    },

    {
        name: "Beauty",
        slug: "beauty"
    },

    {
        name: "Home Items",
        slug: "home-items"
    },

    {
        name: "Fragrance",
        slug: "fragrance"
    },

    {
        name: "Sports",
        slug: "sports"
    },

    {
        name: "Gaming",
        slug: "gaming"
    },

    {
        name: "Random Useful Items",
        slug: "random-useful-items"
    }

];


let allProducts = [];

let allCategories = [];


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


/* =========================================================
   IMAGE URL
========================================================= */

function getImageUrl(product) {

    if (product.image_url) {

        return String(product.image_url).trim();

    }

    if (product.image_path) {

        return String(product.image_path).trim();

    }

    return "";
}


/* =========================================================
   RENDER NAVIGATION
========================================================= */

function renderCategoryNav() {

    let html = "";

    html += `
        <a href="index.html">
            Home
        </a>
    `;

    html += `
        <a href="category.html?type=Trending">
            Trending
        </a>
    `;


    allCategories.forEach(category => {

        if (!category || !category.name) {
            return;
        }

        html += `
            <a href="category.html?type=${encodeURIComponent(category.name)}">
                ${escapeHtml(category.name)}
            </a>
        `;

    });


    html += `
        <a href="about.html">
            ABOUT US
        </a>
    `;


    categoryNav.innerHTML = html;
}


/* =========================================================
   LOAD CATEGORIES

   IMPORTANT:
   If Supabase categories fails,
   website DOES NOT break.

   It uses DEFAULT_CATEGORIES instead.
========================================================= */

async function loadCategories() {

    try {

        const result = await supabase

            .from("categories")

            .select("id,name,slug")

            .order("name", {
                ascending: true
            });


        if (result.error) {

            console.warn(
                "VNR CHOICEZ: categories table unavailable. Using default categories.",
                result.error
            );

            allCategories = DEFAULT_CATEGORIES.map(category => ({
                ...category
            }));

            renderCategoryNav();

            return;
        }


        if (
            Array.isArray(result.data) &&
            result.data.length > 0
        ) {

            allCategories = result.data;

        } else {

            allCategories =
                DEFAULT_CATEGORIES.map(category => ({
                    ...category
                }));

        }


        renderCategoryNav();

    }

    catch (error) {

        console.warn(
            "VNR CHOICEZ: category loading failed. Using default categories.",
            error
        );

        allCategories =
            DEFAULT_CATEGORIES.map(category => ({
                ...category
            }));

        renderCategoryNav();

    }

}


/* =========================================================
   LOAD PRODUCTS

   ONLY USE BASIC PRODUCT COLUMNS.

   This prevents optional V2 fields from
   breaking the entire website.
========================================================= */

async function loadProducts() {

    loading.style.display = "block";

    errorMessage.style.display = "none";

    noResults.style.display = "none";

    productGrid.innerHTML = "";


    try {

        const result = await supabase

            .from("products")

            .select(`
                id,
                category,
                category_id,
                name,
                price,
                shopee_link,
                image_url,
                image_path,
                description
            `)

            .order("id", {
                ascending: false
            });


        if (result.error) {

            console.error(
                "VNR CHOICEZ PRODUCT DATABASE ERROR:",
                result.error
            );

            loading.style.display = "none";

            errorMessage.innerHTML = `
                Unable to load products right now.
                <br><br>
                Please try again later.
            `;

            errorMessage.style.display = "block";

            return;
        }


        allProducts =
            Array.isArray(result.data)
                ? result.data
                : [];


        /*
           CONNECT CATEGORY
        */

        allProducts =
            allProducts.map(product => {

                let categoryName = "";


                if (product.category_id) {

                    const linkedCategory =
                        allCategories.find(
                            category =>
                                category.id ===
                                product.category_id
                        );


                    if (linkedCategory) {

                        categoryName =
                            linkedCategory.name;

                    }

                }


                if (!categoryName && product.category) {

                    categoryName =
                        product.category;

                }


                if (!categoryName) {

                    categoryName =
                        "Uncategorized";

                }


                return {

                    ...product,

                    categoryName

                };

            });


        loading.style.display = "none";


        renderProducts(allProducts);


        console.log(
            "VNR CHOICEZ: products loaded successfully.",
            allProducts.length
        );

    }

    catch (error) {

        console.error(
            "VNR CHOICEZ PRODUCT EXCEPTION:",
            error
        );

        loading.style.display = "none";

        errorMessage.style.display = "block";

    }

}


/* =========================================================
   CREATE PRODUCT CARD
========================================================= */

function createProductCard(product) {

    const card =
        document.createElement("article");


    card.className =
        "product";


    const name =
        product.name ||
        "Unnamed Product";


    const description =
        product.description ||
        "Useful product worth checking out.";


    const category =
        product.categoryName ||
        "Uncategorized";


    const image =
        getImageUrl(product);


    const affiliate =
        product.shopee_link ||
        "";


    const numericPrice =
        Number(product.price);


    const price =
        Number.isFinite(numericPrice)
            ? numericPrice.toFixed(2)
            : "0.00";


    let imageHTML = "";


    if (image) {

        imageHTML = `

            <img

                class="product-image"

                src="${escapeHtml(image)}"

                alt="${escapeHtml(name)}"

                loading="lazy"

                onerror="this.style.display='none';"

            >

        `;

    }


    let buttonHTML = "";


    if (affiliate) {

        buttonHTML = `

            <a

                class="buy-button"

                href="${escapeHtml(affiliate)}"

                target="_blank"

                rel="noopener noreferrer"

            >

                View on Shopee

            </a>

        `;

    }

    else {

        buttonHTML = `

            <div class="buy-button">

                Product link unavailable

            </div>

        `;

    }


    card.innerHTML = `

        ${imageHTML}


        <div class="product-info">

            <h3 class="product-name">

                ${escapeHtml(name)}

            </h3>


            <div class="product-description">

                ${escapeHtml(description)}

            </div>


            <div class="product-category">

                ${escapeHtml(category)}

            </div>


            <div class="product-price">

                RM${price}

            </div>


            ${buttonHTML}

        </div>

    `;


    return card;

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(products) {

    productGrid.innerHTML = "";

    noResults.style.display = "none";


    if (!products.length) {

        noResults.textContent =
            "No products found.";

        noResults.style.display =
            "block";

        return;

    }


    products.forEach(product => {

        productGrid.appendChild(
            createProductCard(product)
        );

    });

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function () {

        const term =
            this.value
                .toLowerCase()
                .trim();


        if (!term) {

            renderProducts(
                allProducts
            );

            return;

        }


        const filtered =
            allProducts.filter(product => {

                const text = [

                    product.name,

                    product.description,

                    product.categoryName,

                    product.category

                ]

                .filter(Boolean)

                .join(" ")

                .toLowerCase();


                return text.includes(term);

            });


        renderProducts(filtered);

    }
);


/* =========================================================
   START WEBSITE
========================================================= */

async function init() {

    console.log(
        "VNR CHOICEZ: website starting..."
    );


    /*
       Categories first.
       Even if categories fail,
       fallback categories are used.
    */

    await loadCategories();


    /*
       Products second.
    */

    await loadProducts();

}


/* =========================================================
   RUN
========================================================= */

init();

</script>

</body>
</html>
