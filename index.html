<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNR CHOICEZ</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f6f6;
            color: #171717;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 42px 20px 38px;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 15px;
            color: #d6d6d6;
        }

        nav {
            background: white;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 14px 15px;
            overflow-x: auto;
            white-space: nowrap;
        }

        nav a {
            text-decoration: none;
            color: #171717;
            font-size: 14px;
            font-weight: 600;
            padding: 9px 15px;
            border: 1px solid #dedede;
            border-radius: 999px;
            background: white;
            transition: 0.2s ease;
        }

        nav a:hover {
            background: #171717;
            color: white;
            border-color: #171717;
        }

        .search-container {
            max-width: 850px;
            margin: 28px auto 0;
            padding: 0 20px;
        }

        #searchInput {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #dcdcdc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        #searchInput:focus {
            border-color: #999;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .section-title {
            font-size: 28px;
            margin: 0 0 24px;
            font-weight: 800;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product {
            background: white;
            border: 1px solid #e7e7e7;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            display: block;
            padding: 5px;
            background: white;
        }

        .product-info {
            padding: 16px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 8px;
            line-height: 1.35;
        }

        .product-description {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .product-category {
            display: inline-block;
            font-size: 11px;
            color: #666;
            background: #f1f1f1;
            padding: 5px 8px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .buy-button {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background: #111;
            color: white;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            transition: 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .buy-button:hover {
            background: #333;
        }

        #loading {
            text-align: center;
            color: #777;
            padding: 50px 10px;
            font-size: 15px;
        }

        #noResults {
            display: none;
            text-align: center;
            color: #777;
            padding: 40px 10px;
            font-size: 15px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        footer .footer-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        footer .footer-text {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }

        @media (max-width: 1000px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            header {
                padding: 32px 15px 30px;
            }

            .logo {
                font-size: 32px;
            }

            .tagline {
                font-size: 13px;
            }

            nav {
                justify-content: flex-start;
            }

            .container {
                padding: 28px 12px 50px;
            }

            .section-title {
                font-size: 24px;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .product {
                border-radius: 9px;
            }

            .product-image {
                padding: 3px;
            }

            .product-info {
                padding: 12px;
            }

            .product-name {
                font-size: 14px;
            }

            .product-description {
                font-size: 12px;
            }

            .product-price {
                font-size: 16px;
            }

            .buy-button {
                font-size: 13px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">VNR CHOICEZ</div>
    <div class="tagline">Things worth knowing. Things worth buying.</div>
</header>

<nav id="categoryNav">
    <a href="index.html">Home</a>
    <a href="category.html?type=Trending">Trending</a>
    <!-- Categories will load automatically from Supabase -->
</nav>

<div class="search-container">
    <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
    >
</div>

<main class="container">

    <h2 class="section-title" id="sectionTitle">🏠 Home</h2>

    <div id="loading">
        Loading products...
    </div>

    <div class="product-grid" id="productGrid"></div>

    <div id="noResults">
        No products found.
    </div>

</main>

<footer>
    <div class="footer-title">@2026 VNR CHOICEZ</div>

    <div class="footer-text">
        Things worth knowing. Things worth buying.
    </div>

    <div class="footer-text">
        Curated finds, useful products, and things worth sharing.
    </div>
</footer>


<script>

    // =========================================
    // VNR CHOICEZ - SUPABASE PRODUCT SYSTEM
    // =========================================

    const productGrid = document.getElementById("productGrid");
    const searchInput = document.getElementById("searchInput");
    const noResults = document.getElementById("noResults");
    const loading = document.getElementById("loading");
    const categoryNav = document.getElementById("categoryNav");

    let allProducts = [];
    let allCategories = [];


    // =========================================
    // LOAD PRODUCTS
    // =========================================

    async function loadProducts() {

        loading.style.display = "block";
        productGrid.innerHTML = "";
        noResults.style.display = "none";

        const { data, error } = await supabase
            .from("products")
            .select(`
                id,
                name,
                description,
                price,
                image_url,
                image_path,
                affiliate_url,
                shopee_link,
                status,
                featured,
                views,
                clicks,
                created_at,
                sort_order,
                category,
                category_id,
                categories (
                    id,
                    name,
                    slug
                )
            `)
            .eq("status", "published")
            .order("sort_order", {
                ascending: true
            })
            .order("created_at", {
                ascending: false
            });

        loading.style.display = "none";

        if (error) {
            console.error(error);

            productGrid.innerHTML = "";

            noResults.textContent =
                "Unable to load products. Please try again.";

            noResults.style.display = "block";

            return;
        }

        allProducts = data || [];

        renderProducts(allProducts);
    }


    // =========================================
    // LOAD CATEGORIES
    // =========================================

    async function loadCategories() {

        const { data, error } = await supabase
            .from("categories")
            .select("id,name,slug")
            .order("name", {
                ascending: true
            });

        if (error) {
            console.error(error);
            return;
        }

        allCategories = data || [];

        renderCategoryNav();
    }


    // =========================================
    // CATEGORY NAVIGATION
    // =========================================

    function renderCategoryNav() {

        const staticLinks = `
            <a href="index.html">Home</a>
            <a href="category.html?type=Trending">Trending</a>
        `;

        const categoryLinks = allCategories.map(category => {

            return `
                <a href="category.html?type=${encodeURIComponent(category.name)}">
                    ${escapeHtml(category.name)}
                </a>
            `;

        }).join("");

        categoryNav.innerHTML =
            staticLinks +
            categoryLinks +
            `<a href="about.html">ABOUT US</a>`;
    }


    // =========================================
    // RENDER PRODUCTS
    // =========================================

    function renderProducts(products) {

        productGrid.innerHTML = "";

        if (!products.length) {

            noResults.textContent =
                "No products found.";

            noResults.style.display = "block";

            return;
        }

        noResults.style.display = "none";

        products.forEach(product => {

            const card = createProductCard(product);

            productGrid.appendChild(card);

        });
    }


    // =========================================
    // CREATE PRODUCT CARD
    // =========================================

    function createProductCard(product) {

        const card = document.createElement("div");

        card.className = "product";

        const categoryName =
            product.categories?.name ||
            product.category ||
            "Uncategorized";

        const imageUrl =
            product.image_url ||
            "";

        const affiliateUrl =
            product.affiliate_url ||
            product.shopee_link ||
            "#";

        const description =
            product.description ||
            "Useful product worth checking out.";

        const price =
            Number(product.price || 0).toFixed(2);

        card.setAttribute(
            "data-search",
            `
            ${product.name || ""}
            ${description}
            ${categoryName}
            `.toLowerCase()
        );

        card.innerHTML = `

            <img
                class="product-image"
                src="${escapeAttribute(imageUrl)}"
                alt="${escapeAttribute(product.name || "Product")}"
                onerror="this.style.display='none';"
            >

            <div class="product-info">

                <h3 class="product-name">
                    ${escapeHtml(product.name || "Unnamed Product")}
                </h3>

                <div class="product-description">
                    ${escapeHtml(description)}
                </div>

                <div class="product-category">
                    ${escapeHtml(categoryName)}
                </div>

                <div class="product-price">
                    RM${price}
                </div>

                <a
                    class="buy-button"
                    href="${escapeAttribute(affiliateUrl)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-product-id="${product.id}"
                >
                    View on Shopee
                </a>

            </div>
        `;

        const button =
            card.querySelector(".buy-button");

        button.addEventListener("click", function () {

            trackProductClick(product.id);

        });

        return card;
    }


    // =========================================
    // SEARCH
    // =========================================

    searchInput.addEventListener("input", function () {

        const searchTerm =
            this.value.toLowerCase().trim();

        if (!searchTerm) {

            renderProducts(allProducts);

            return;
        }

        const filteredProducts =
            allProducts.filter(product => {

                const categoryName =
                    product.categories?.name ||
                    product.category ||
                    "";

                const searchableText = `
                    ${product.name || ""}
                    ${product.description || ""}
                    ${categoryName}
                `.toLowerCase();

                return searchableText.includes(searchTerm);

            });

        renderProducts(filteredProducts);
    });


    // =========================================
    // TRACK PRODUCT VIEWS
    // =========================================

    async function trackProductView(productId) {

        try {

            const product =
                allProducts.find(
                    item => item.id === productId
                );

            if (!product) return;

            await supabase
                .from("products")
                .update({
                    views: (product.views || 0) + 1
                })
                .eq("id", productId);

        } catch (error) {

            console.error(
                "View tracking failed:",
                error
            );

        }
    }


    // =========================================
    // TRACK SHOPEE CLICKS
    // =========================================

    async function trackProductClick(productId) {

        try {

            const product =
                allProducts.find(
                    item => item.id === productId
                );

            if (!product) return;

            await supabase
                .from("products")
                .update({
                    clicks: (product.clicks || 0) + 1
                })
                .eq("id", productId);

        } catch (error) {

            console.error(
                "Click tracking failed:",
                error
            );

        }
    }


    // =========================================
    // HTML SECURITY HELPERS
    // =========================================

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function escapeAttribute(value) {

        return escapeHtml(value);
    }


    // =========================================
    // START
    // =========================================

    async function init() {

        await Promise.all([
            loadCategories(),
            loadProducts()
        ]);

    }

    init();

</script>

</body>
</html>
