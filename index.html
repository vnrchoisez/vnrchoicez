<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="VNR CHOICEZ — Discover useful products, trending finds and curated Shopee picks."
    >

    <title>VNR CHOICEZ</title>

    <link
        rel="icon"
        type="image/png"
        href="cropped_circle_image.png"
    >

    <link
        rel="apple-touch-icon"
        href="cropped_circle_image.png"
    >

    <style>

        :root {

            --bg:
                #F7F4EF;

            --card:
                #FCFAF7;

            --text:
                #24221F;

            --muted:
                #777168;

            --line:
                #E3DDD4;

            --sand:
                #D9CCBA;

            --sand-soft:
                #EFE8DE;

            --gold:
                #B69A6B;

            --white:
                #FFFFFF;

            --ease:
                cubic-bezier(0.22, 1, 0.36, 1);

        }


        * {
            box-sizing:
                border-box;
        }


        html {
            scroll-behavior:
                smooth;
        }


        body {

            margin:
                0;

            padding:
                0;

            background:
                var(--bg);

            color:
                var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            -webkit-font-smoothing:
                antialiased;

            overflow-x:
                hidden;
        }


        a {
            color:
                inherit;

            text-decoration:
                none;
        }


        button,
        input {
            font-family:
                inherit;
        }


        /* =========================================================
           HEADER
           ========================================================= */

        header {

            position:
                sticky;

            top:
                0;

            z-index:
                5000;

            width:
                100%;

            height:
                76px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            padding:
                0 5vw;

            background:
                rgba(23,23,23,0.94);

            border-bottom:
                1px solid
                rgba(255,255,255,0.07);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            transition:
                height 0.35s var(--ease),
                background 0.35s var(--ease),
                box-shadow 0.35s var(--ease);
        }


        header.scrolled {

            height:
                68px;

            background:
                rgba(23,23,23,0.985);

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.18);
        }


        .logo {

            display:
                flex;

            align-items:
                center;

            gap:
                11px;

            color:
                #FFFFFF;

            font-size:
                16px;

            font-weight:
                700;

            letter-spacing:
                0.13em;

            white-space:
                nowrap;
        }


        .logo img {

            width:
                36px;

            height:
                36px;

            object-fit:
                cover;

            border-radius:
                50%;

            border:
                1px solid
                rgba(255,255,255,0.16);
        }


        nav {

            display:
                flex;

            align-items:
                center;

            gap:
                7px;
        }


        nav a,
        .category-toggle {

            min-height:
                42px;

            padding:
                0 13px;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                7px;

            border:
                0;

            background:
                transparent;

            color:
                rgba(255,255,255,0.72);

            border-radius:
                9px;

            font-size:
                12px;

            font-weight:
                600;

            letter-spacing:
                0.02em;

            cursor:
                pointer;

            transition:
                color 0.25s ease,
                background 0.25s ease;
        }


        nav a:hover,
        .category-toggle:hover {

            color:
                #FFFFFF;

            background:
                rgba(255,255,255,0.07);
        }


        .category-wrapper {

            position:
                relative;
        }


        .category-toggle .arrow {

            font-size:
                9px;

            opacity:
                0.75;

            transition:
                transform 0.25s ease;
        }


        .category-wrapper.open
        .category-toggle .arrow {

            transform:
                rotate(180deg);
        }


        .dropdown-menu {

            position:
                absolute;

            top:
                calc(100% + 9px);

            right:
                0;

            min-width:
                215px;

            max-height:
                420px;

            overflow-y:
                auto;

            padding:
                7px;

            background:
                rgba(28,28,28,0.985);

            border:
                1px solid
                rgba(255,255,255,0.09);

            border-radius:
                12px;

            box-shadow:
                0 22px 50px
                rgba(0,0,0,0.30);

            opacity:
                0;

            visibility:
                hidden;

            pointer-events:
                none;

            transform:
                translateY(-7px);

            transition:
                opacity 0.25s ease,
                transform 0.25s ease,
                visibility 0.25s;
        }


        .category-wrapper.open
        .dropdown-menu {

            opacity:
                1;

            visibility:
                visible;

            pointer-events:
                auto;

            transform:
                translateY(0);
        }


        .dropdown-menu a {

            width:
                100%;

            min-height:
                42px;

            justify-content:
                flex-start;

            padding:
                0 12px;

            color:
                rgba(255,255,255,0.75);

            border-radius:
                8px;
        }


        .dropdown-menu a:hover {

            color:
                #FFFFFF;

            background:
                rgba(255,255,255,0.08);
        }


        .mobile-menu-btn {

            display:
                none;

            width:
                42px;

            height:
                42px;

            align-items:
                center;

            justify-content:
                center;

            padding:
                0;

            border:
                0;

            background:
                transparent;

            color:
                #FFFFFF;

            cursor:
                pointer;
        }


        .mobile-menu-btn span,
        .mobile-menu-btn::before,
        .mobile-menu-btn::after {

            content:
                "";

            position:
                absolute;

            width:
                20px;

            height:
                1.5px;

            background:
                currentColor;

            transition:
                transform 0.25s ease;
        }


        .mobile-menu-btn {

            position:
                relative;
        }


        .mobile-menu-btn::before {

            transform:
                translateY(-6px);
        }


        .mobile-menu-btn::after {

            transform:
                translateY(6px);
        }


        .mobile-menu-btn.active span {

            opacity:
                0;
        }


        .mobile-menu-btn.active::before {

            transform:
                rotate(45deg);
        }


        .mobile-menu-btn.active::after {

            transform:
                rotate(-45deg);
        }


        /* =========================================================
           HERO
           ========================================================= */

        .hero {

            min-height:
                510px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                80px 20px 95px;

            text-align:
                center;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(182,154,107,0.15),
                    transparent 48%
                ),
                var(--bg);

            position:
                relative;

            overflow:
                hidden;
        }


        .hero::before {

            content:
                "";

            position:
                absolute;

            width:
                500px;

            height:
                500px;

            top:
                -300px;

            left:
                50%;

            transform:
                translateX(-50%);

            border-radius:
                50%;

            border:
                1px solid
                rgba(182,154,107,0.15);

            box-shadow:
                0 0 0 80px
                rgba(182,154,107,0.025),
                0 0 0 160px
                rgba(182,154,107,0.018);
        }


        .hero-content {

            position:
                relative;

            z-index:
                2;

            max-width:
                820px;

            opacity:
                0;

            transform:
                translateY(20px);

            animation:
                sectionReveal
                0.9s
                0.1s
                var(--ease)
                forwards;
        }


        .hero-eyebrow {

            margin-bottom:
                20px;

            color:
                var(--gold);

            font-size:
                11px;

            font-weight:
                700;

            letter-spacing:
                0.32em;

            text-transform:
                uppercase;
        }


        .hero h1 {

            margin:
                0;

            font-size:
                clamp(44px, 7vw, 88px);

            line-height:
                0.94;

            letter-spacing:
                -0.055em;

            font-weight:
                700;
        }


        .hero p {

            max-width:
                620px;

            margin:
                27px auto 0;

            color:
                var(--muted);

            font-size:
                15px;

            line-height:
                1.75;
        }


        /* =========================================================
           SEARCH
           ========================================================= */

        .search-section {

            position:
                relative;

            z-index:
                1000;

            width:
                min(900px, calc(100% - 40px));

            margin:
                0 auto 70px;

            opacity:
                0;

            transform:
                translateY(20px);

            animation:
                sectionReveal
                0.8s
                0.48s
                var(--ease)
                forwards;
        }


        .search-box {

            position:
                relative;

            z-index:
                1000;

            overflow:
                visible;
        }


        .search-box input {

            width:
                100%;

            height:
                60px;

            padding:
                0 70px 0 50px;

            color:
                var(--text);

            background:
                rgba(250,248,244,0.96);

            border:
                1px solid
                var(--line);

            border-radius:
                15px;

            outline:
                none;

            font-size:
                14px;

            box-shadow:
                0 10px 35px
                rgba(36,34,31,0.065);

            transition:
                border-color 0.3s var(--ease),
                background 0.3s var(--ease),
                box-shadow 0.35s var(--ease),
                transform 0.35s var(--ease);
        }


        .search-box input::placeholder {

            color:
                #9B958B;
        }


        .search-box input:hover {

            border-color:
                #C5BBAE;
        }


        .search-box:focus-within input {

            background:
                #FAF8F4;

            border-color:
                rgba(182,154,107,0.65);

            box-shadow:
                0 0 0 4px
                rgba(182,154,107,0.09),

                0 16px 42px
                rgba(36,34,31,0.10);

            transform:
                translateY(-1px);
        }


        /* =========================================================
           FILTER BUTTON
           ========================================================= */

        .filter-button {

            position:
                absolute;

            right:
                10px;

            top:
                50%;

            width:
                42px;

            height:
                42px;

            transform:
                translateY(-50%);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                0;

            border:
                0;

            border-radius:
                10px;

            background:
                #24211E;

            color:
                #FAF8F4;

            cursor:
                pointer;

            z-index:
                10002;
        }


        .filter-button:hover {

            background:
                #3A3530;
        }


        .filter-button svg {

            width:
                20px;

            height:
                20px;

            display:
                block;
        }


        .filter-menu {

            position:
                absolute;

            top:
                calc(100% + 8px);

            right:
                0;

            min-width:
                215px;

            padding:
                7px;

            background:
                #FFFFFF;

            border:
                1px solid
                rgba(36,34,31,0.12);

            border-radius:
                12px;

            box-shadow:
                0 18px 45px
                rgba(0,0,0,0.18),

                0 5px 15px
                rgba(0,0,0,0.08);

            display:
                none;

            z-index:
                99999;
        }


        .filter-menu.open {

            display:
                block;
        }


        .filter-option {

            width:
                100%;

            display:
                flex;

            align-items:
                center;

            padding:
                11px 13px;

            border:
                0;

            border-radius:
                8px;

            background:
                transparent;

            color:
                #24211E;

            font-family:
                inherit;

            font-size:
                13px;

            text-align:
                left;

            cursor:
                pointer;
        }


        .filter-option:hover {

            background:
                #F3EEE7;
        }


        .filter-option.active {

            background:
                #24211E;

            color:
                #FFFFFF;
        }


        .search-icon {

            position:
                absolute;

            left:
                19px;

            top:
                50%;

            width:
                15px;

            height:
                15px;

            border:
                1.6px solid
                #9A958C;

            border-radius:
                50%;

            transform:
                translateY(-55%);

            transition:
                border-color 0.3s var(--ease),
                transform 0.3s var(--ease);
        }


        .search-icon::after {

            content:
                "";

            position:
                absolute;

            width:
                6px;

            height:
                1.6px;

            right:
                -4px;

            bottom:
                -2px;

            background:
                #9A958C;

            transform:
                rotate(45deg);

            border-radius:
                2px;
        }


        .search-box:focus-within
        .search-icon {

            border-color:
                var(--gold);

            transform:
                translateY(-55%)
                scale(1.05);
        }


        /* =========================================================
           PRODUCTS MAIN
           ========================================================= */

        #productsMain {

            position:
                relative;

            z-index:
                1;

            width:
                min(1400px, calc(100% - 40px));

            margin:
                0 auto;

            padding-bottom:
                80px;
        }


        .section-header {

            display:
                flex;

            align-items:
                flex-end;

            justify-content:
                space-between;

            margin-bottom:
                24px;
        }


        .section-heading {

            margin:
                0;

            font-size:
                clamp(25px, 3vw, 34px);

            letter-spacing:
                -0.035em;
        }


        .section-subheading {

            margin:
                8px 0 0;

            color:
                var(--muted);

            font-size:
                13px;
        }


        .products-grid {

            position:
                relative;

            z-index:
                1;

            display:
                grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap:
                18px;

            align-items:
                stretch;
        }


        /* =========================================================
           PRODUCT CARD
           ========================================================= */

        .product {

            position:
                relative;

            z-index:
                1;

            min-width:
                0;

            background:
                var(--card);

            border:
                1px solid
                var(--line);

            border-radius:
                14px;

            overflow:
                hidden;

            opacity:
                0;

            transform:
                translateY(20px)
                scale(0.985);

            transition:
                transform 0.4s var(--ease),
                border-color 0.35s var(--ease),
                box-shadow 0.4s var(--ease),
                background 0.35s var(--ease);

            animation:
                productReveal
                0.7s
                var(--ease)
                forwards;

            animation-delay:
                var(--delay, 0ms);

            display:
                flex;

            flex-direction:
                column;
        }


        @media (hover: hover) {

            .product:hover {

                transform:
                    translateY(-5px)
                    scale(1.004);

                background:
                    #FFFFFF;

                border-color:
                    #C8BFB2;

                box-shadow:
                    0 18px 45px
                    rgba(36,34,31,0.105);
            }

        }


        .product-image-wrap {

            position:
                relative;

            aspect-ratio:
                1 / 1;

            background:
                var(--sand-soft);

            overflow:
                hidden;

            flex-shrink:
                0;
        }


        .product-image-wrap::after {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            background:
                linear-gradient(
                    120deg,
                    transparent 20%,
                    rgba(255,255,255,0.42) 48%,
                    transparent 72%
                );

            transform:
                translateX(-120%);

            transition:
                transform 0.8s var(--ease);

            pointer-events:
                none;
        }


        @media (hover: hover) {

            .product:hover
            .product-image-wrap::after {

                transform:
                    translateX(120%);
            }

        }


        .product-image {

            width:
                100%;

            height:
                100%;

            display:
                block;

            object-fit:
                cover;

            transition:
                transform 0.7s var(--ease);
        }


        @media (hover: hover) {

            .product:hover
            .product-image {

                transform:
                    scale(1.045);
            }

        }


        .product-body {

            display:
                flex;

            flex-direction:
                column;

            flex:
                1;

            padding:
                17px 17px 18px;
        }


        .product-name {

            margin:
                0;

            color:
                var(--text);

            font-size:
                15px;

            line-height:
                1.45;

            font-weight:
                700;
        }


        .product-description {

            margin:
                8px 0 0;

            color:
                var(--muted);

            font-size:
                12px;

            line-height:
                1.65;

            display:
                -webkit-box;

            -webkit-line-clamp:
                3;

            -webkit-box-orient:
                vertical;

            overflow:
                hidden;
        }


        .product-price {

            margin-top:
                13px;

            color:
                var(--text);

            font-size:
                14px;

            font-weight:
                700;
        }


        .product-platforms {

            display:
                flex;

            flex-direction:
                column;

            gap:
                7px;

            margin-top:
                15px;
        }


        .platform-button {

            width:
                100%;

            min-height:
                39px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;

            padding:
                0 11px;

            border:
                1px solid
                var(--line);

            border-radius:
                9px;

            background:
                #FFFFFF;

            color:
                var(--text);

            font-size:
                11px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease;
        }


        .platform-button:hover {

            transform:
                translateY(-1px);

            border-color:
                #C3B49F;

            background:
                #FAF7F2;
        }


        .platform-name {

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;
        }


        .platform-price {

            color:
                var(--gold);

            white-space:
                nowrap;
        }


        .product-footer {

            margin-top:
                auto;

            padding-top:
                15px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                10px;
        }


        .product-category {

            color:
                #9A9388;

            font-size:
                10px;

            font-weight:
                700;

            letter-spacing:
                0.09em;

            text-transform:
                uppercase;
        }


        .view-product {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                5px;

            color:
                var(--text);

            font-size:
                11px;

            font-weight:
                700;
        }


        .view-product span {

            transition:
                transform 0.25s ease;
        }


        .product:hover
        .view-product span {

            transform:
                translateX(3px);
        }


        /* =========================================================
           STATES
           ========================================================= */

        .loading,
        .empty-state,
        .error-message {

            grid-column:
                1 / -1;

            min-height:
                180px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            color:
                var(--muted);

            font-size:
                13px;

            border:
                1px dashed
                var(--line);

            border-radius:
                14px;

            background:
                rgba(252,250,247,0.65);
        }


        .loading::after {

            content:
                "";

            width:
                20px;

            height:
                20px;

            margin-left:
                10px;

            border:
                2px solid
                #DDD5CA;

            border-top-color:
                var(--gold);

            border-radius:
                50%;

            animation:
                spin
                0.8s linear infinite;
        }


        /* =========================================================
           FOOTER
           ========================================================= */

        footer {

            padding:
                55px 20px;

            text-align:
                center;

            border-top:
                1px solid
                var(--line);

            background:
                #F2EEE7;

            color:
                var(--muted);
        }


        .footer-brand {

            color:
                var(--text);

            font-size:
                13px;

            font-weight:
                700;

            letter-spacing:
                0.16em;
        }


        .footer-text {

            margin:
                10px 0 0;

            font-size:
                11px;

            line-height:
                1.7;
        }


        /* =========================================================
           ANIMATIONS
           ========================================================= */

        @keyframes sectionReveal {

            from {

                opacity:
                    0;

                transform:
                    translateY(20px);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);
            }

        }


        @keyframes productReveal {

            from {

                opacity:
                    0;

                transform:
                    translateY(20px)
                    scale(0.985);
            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }

        }


        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 1100px) {

            .products-grid {

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }


        @media (max-width: 900px) {

            header {

                padding:
                    0 20px;
            }


            nav {

                gap:
                    2px;
            }


            nav a,
            .category-toggle {

                padding:
                    0 10px;
            }


            .products-grid {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }


        @media (max-width: 700px) {

            header {

                height:
                    66px;
            }


            .logo {

                font-size:
                    15px;
            }


            .logo img {

                width:
                    31px;

                height:
                    31px;
            }


            .mobile-menu-btn {

                display:
                    flex;
            }


            nav {

                position:
                    absolute;

                top:

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
