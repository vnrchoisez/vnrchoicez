<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VNR CHOICEZ — Cinematic</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         CINEMATIC STAGE
    ====================================================== -->

    <main class="cinematic-stage">

        <!-- Ambient lighting -->
        <div class="ambient ambient-red"></div>
        <div class="ambient ambient-purple"></div>

        <!-- Film grain -->
        <div class="film-grain"></div>

        <!-- =================================================
             SCENE 01 / 02 / 03
        ================================================== -->

        <section class="scene">

            <!-- Scene number -->
            <div class="scene-number">
                01 — 03
            </div>


            <!-- =============================================
                 LEFT TEXT
            ============================================== -->

            <div class="hero-copy">

                <div class="copy-small">
                    VNR CHOICEZ
                </div>

                <h1>
                    CHOICES.<br>
                    MADE SIMPLE.
                </h1>

                <div class="copy-line"></div>

            </div>


            <!-- =============================================
                 IPHONE
            ============================================== -->

            <div class="iphone-wrapper">

                <div class="iphone">

                    <!-- Side frame -->
                    <div class="iphone-frame"></div>


                    <!-- Screen -->
                    <div class="iphone-screen">

                        <!-- Screen reflection -->
                        <div class="screen-reflection"></div>

                        <!-- Website layer -->
                        <div class="website-layer">

                            <iframe
                                id="websiteFrame"
                                src="https://vnrchoisez.github.io/vnrchoicez/index.html"
                                title="VNR CHOICEZ Website"
                            ></iframe>

                        </div>


                        <!-- Fake screen wake glow -->
                        <div class="screen-wake"></div>


                        <!-- Dynamic Island -->
                        <div class="dynamic-island"></div>

                    </div>


                    <!-- =====================================
                         BACK CAMERA
                    ====================================== -->

                    <div class="camera-module">

                        <div class="camera-lens lens-1"></div>
                        <div class="camera-lens lens-2"></div>
                        <div class="camera-lens lens-3"></div>

                        <div class="camera-flash"></div>
                        <div class="camera-sensor"></div>

                    </div>


                    <!-- Side buttons -->
                    <div class="volume-button volume-1"></div>
                    <div class="volume-button volume-2"></div>
                    <div class="power-button"></div>

                </div>

            </div>


            <!-- =============================================
                 CENTER BRAND
            ============================================== -->

            <div class="center-brand">
                <span>VNR</span>
                <span>CHOICEZ</span>
            </div>


            <!-- =============================================
                 SCENE 03 TRANSITION
            ============================================== -->

            <div class="website-transition"></div>


            <!-- =============================================
                 CINEMATIC LIGHT
            ============================================== -->

            <div class="light-sweep"></div>

        </section>


        <!-- =============================================
             SCENE 03 TEXT
        ============================================== -->

        <div class="scene-three-copy">

            <div class="scene-three-small">
                YOUR NEXT CHOICE
            </div>

            <div class="scene-three-title">
                DISCOVER.
            </div>

        </div>


        <!-- =============================================
             FINAL TRANSITION
        ============================================== -->

        <div class="fullscreen-transition"></div>

    </main>


    <script src="script.js"></script>

</body>
</html>
