<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="VNR CHOICEZ — Discover useful products, trending finds and curated Shopee picks."
    >

    <title>VNR CHOICEZ</title>

    <link
        rel="icon"
        type="image/png"
        href="cropped_circle_image.png"
    >

    <link
        rel="apple-touch-icon"
        href="cropped_circle_image.png"
    >

    <style>

        :root {
            --black: #070707;
            --dark: #0d0d0d;
            --dark-soft: #141414;
            --white: #ffffff;
            --text: #f4f4f4;
            --muted: #9b9b9b;
            --line: rgba(255,255,255,0.09);
            --accent: #ffffff;

            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255,255,255,0.06),
                    transparent 35%
                ),
                var(--black);

            color: var(--text);

            min-height: 100vh;

            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;
            height: 72px;

            background: rgba(7,7,7,0.82);

            border-bottom: 1px solid var(--line);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            display: flex;
            align-items: center;
        }

        .header-inner {
            width: min(1180px, calc(100% - 40px));
            height: 100%;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;

            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.12em;

            white-space: nowrap;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        nav a,
        .category-toggle {
            height: 42px;

            display: flex;
            align-items: center;
            gap: 7px;

            padding: 0 13px;

            border-radius: 10px;

            color: #d7d7d7;

            font-size: 14px;
            font-weight: 500;

            background: transparent;

            border: 0;

            cursor: pointer;

            transition:
                color 0.25s var(--ease),
                background 0.25s var(--ease);
        }

        nav a:hover,
        .category-toggle:hover {
            color: #fff;
            background: rgba(255,255,255,0.06);
        }

        .mobile-menu-btn {
            display: none;

            width: 42px;
            height: 42px;

            border: 0;
            background: transparent;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;

            cursor: pointer;
        }

        .mobile-menu-btn span {
            width: 20px;
            height: 2px;

            border-radius: 10px;

            background: #fff;

            transition:
                transform 0.3s var(--ease),
                opacity 0.2s ease;
        }

        .mobile-menu-btn.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .mobile-menu-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .mobile-menu-btn.active span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* =========================
           CATEGORY DROPDOWN
        ========================= */

        .category-wrapper {
            position: relative;
        }

        .category-toggle .arrow {
            font-size: 11px;

            transition:
                transform 0.3s var(--ease);
        }

        .category-wrapper.open .category-toggle .arrow {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;

            top: calc(100% + 8px);
            left: 0;

            width: 220px;

            padding: 6px;

            background: rgba(16,16,16,0.97);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 13px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transform:
                translateY(-8px)
                scale(0.98);

            transform-origin: top center;

            transition:
                opacity 0.25s var(--ease),
                transform 0.3s var(--ease),
                visibility 0.25s;
        }

        .category-wrapper.open .dropdown-menu {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transform:
                translateY(0)
                scale(1);
        }

        .dropdown-menu a {
            width: 100%;

            min-height: 40px;

            padding: 0 12px;

            display: flex;
            align-items: center;

            border-radius: 8px;

            font-size: 13px;
            color: #cfcfcf;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .dropdown-menu a:hover {
            background: rgba(255,255,255,0.07);
            color: #fff;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            width: min(1180px, calc(100% - 40px));

            margin: auto;

            padding:
                110px
                0
                75px;

            text-align: center;
        }

        .hero-label {
            display: inline-flex;

            padding: 7px 13px;

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 999px;

            color: #a7a7a7;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 0.12em;
            text-transform: uppercase;

            margin-bottom: 22px;
        }

        .hero h1 {
            font-size: clamp(42px, 7vw, 82px);

            line-height: 0.95;

            letter-spacing: -0.055em;

            font-weight: 800;

            margin-bottom: 25px;
        }

        .hero p {
            max-width: 620px;

            margin: auto;

            color: var(--muted);

            font-size: 15px;
            line-height: 1.7;
        }

        /* =========================
           SEARCH
        ========================= */

        .search-section {
            width: min(700px, calc(100% - 40px));

            margin:
                0
                auto
                65px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;

            height: 56px;

            padding:
                0
                18px
                0
                48px;

            border:
                1px solid rgba(255,255,255,0.1);

            border-radius: 14px;

            outline: none;

            background: rgba(255,255,255,0.035);

            color: #fff;

            transition:
                border-color 0.25s ease,
                background 0.25s ease;
        }

        .search-box input::placeholder {
            color: #737373;
        }

        .search-box input:focus {
            border-color: rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.05);
        }

        .search-icon {
            position: absolute;

            left: 18px;
            top: 50%;

            transform: translateY(-50%);

            color: #777;

            font-size: 17px;

            pointer-events: none;
        }

        /* =========================
           PRODUCTS
        ========================= */

        main {
            width: min(1180px, calc(100% - 40px));

            margin: auto;

            padding-bottom: 100px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }

        .section-header h2 {
            font-size: 20px;
            letter-spacing: -0.02em;
        }

        .product-count {
            color: #777;
            font-size: 13px;
        }

        .products-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 18px;
        }

        .product-card {
            overflow: hidden;

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.045),
                    rgba(255,255,255,0.018)
                );

            transition:
                transform 0.35s var(--ease),
                border-color 0.3s ease,
                background 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);

            border-color:
                rgba(255,255,255,0.17);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.065),
                    rgba(255,255,255,0.025)
                );
        }

        .product-image-wrap {
            aspect-ratio: 1 / 1;

            overflow: hidden;

            background: #111;
        }

        .product-image {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition:
                transform 0.5s var(--ease);
        }

        .product-card:hover .product-image {
            transform: scale(1.04);
        }

        .product-info {
            padding: 15px;
        }

        .product-category {
            color: #777;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 0.1em;

            margin-bottom: 7px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;

            line-height: 1.4;

            margin-bottom: 8px;
        }

        .product-description {
            color: #858585;

            font-size: 12px;

            line-height: 1.5;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;

            overflow: hidden;

            margin-bottom: 13px;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        .product-price {
            font-size: 14px;
            font-weight: 700;
        }

        .view-product {
            padding: 7px 10px;

            border-radius: 8px;

            background: #fff;
            color: #000;

            font-size: 11px;
            font-weight: 700;

            transition:
                transform 0.2s ease;
        }

        .view-product:hover {
            transform: translateY(-1px);
        }

        .empty-state {
            padding: 60px 20px;

            text-align: center;

            color: #777;

            border:
                1px dashed rgba(255,255,255,0.1);

            border-radius: 15px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top:
                1px solid rgba(255,255,255,0.08);

            padding:
                55px
                20px
                40px;

            text-align: center;

            color: #777;
        }

        .footer-logo {
            color: #fff;

            font-size: 14px;
            font-weight: 800;

            letter-spacing: 0.12em;

            margin-bottom: 10px;
        }

        footer p {
            font-size: 12px;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 950px) {

            .products-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                height: 66px;
            }

            .header-inner {
                width: calc(100% - 24px);
            }

            .logo {
                font-size: 15px;
            }

            .mobile-menu-btn {
                display: flex;
            }

            nav {
                position: absolute;

                top: calc(100% + 1px);
                left: 0;
                right: 0;

                display: flex;

                flex-direction: column;

                align-items: stretch;

                padding: 10px 15px 15px;

                background:
                    rgba(7,7,7,0.97);

                border-bottom:
                    1px solid rgba(255,255,255,0.08);

                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);

                opacity: 0;
                visibility: hidden;
                pointer-events: none;

                transform: translateY(-8px);

                transition:
                    opacity 0.3s var(--ease),
                    transform 0.35s var(--ease),
                    visibility 0.3s;
            }

            nav.mobile-open {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;

                transform: translateY(0);
            }

            nav a,
            .category-toggle {
                width: 100%;

                justify-content: space-between;

                min-height: 48px;

                padding: 0 13px;

                border-radius: 10px;
            }

            .category-wrapper {
                width: 100%;
            }

            /*
             * IMPORTANT FIX:
             *
             * When Categories is CLOSED:
             * - dropdown has ZERO height
             * - ZERO padding
             * - ZERO margin
             * - does not create empty space
             *
             * When Categories is OPEN:
             * - dropdown expands normally
             * - About Us moves below the category list
             */

            .dropdown-menu {
                position: static;

                width: 100%;

                margin-top: 0;
                padding: 0;

                max-height: 0;
                overflow: hidden;

                box-shadow: none;

                border-color: transparent;

                opacity: 0;
                visibility: hidden;
                pointer-events: none;

                transform:
                    translateY(-5px)
                    scale(0.99);

                transition:
                    opacity 0.28s var(--ease),
                    transform 0.32s var(--ease),
                    visibility 0.28s,
                    max-height 0.35s var(--ease),
                    margin-top 0.35s var(--ease),
                    padding 0.35s var(--ease),
                    border-color 0.35s var(--ease);
            }

            .category-wrapper.open .dropdown-menu {
                max-height: 600px;

                margin-top: 4px;
                padding: 4px;

                opacity: 1;
                visibility: visible;
                pointer-events: auto;

                border-color:
                    rgba(255,255,255,0.06);

                transform:
                    translateY(0)
                    scale(1);
            }

            .dropdown-menu a {
                min-height: 43px;
            }

            .hero {
                width: calc(100% - 30px);

                padding:
                    75px
                    0
                    55px;
            }

            .hero h1 {
                font-size: clamp(40px, 13vw, 62px);
            }

            .hero p {
                font-size: 14px;
            }

            .search-section {
                width: calc(100% - 30px);

                margin-bottom: 50px;
            }

            main {
                width: calc(100% - 30px);
            }

            .products-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 12px;
            }

            .product-info {
                padding: 12px;
            }

            .product-name {
                font-size: 13px;
            }

            .product-description {
                font-size: 11px;
            }

            .product-price {
                font-size: 13px;
            }

            .view-product {
                font-size: 10px;
                padding: 6px 8px;
            }

        }

        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 380px) {

            .products-grid {
                gap: 9px;
            }

            .product-info {
                padding: 10px;
            }

            .product-name {
                font-size: 12px;
            }

            .product-description {
                font-size: 10px;
            }

        }

    </style>

</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="header-inner">

            <a
                href="index.html"
                class="logo"
            >
                VNR CHOICEZ
            </a>

            <button
                class="mobile-menu-btn"
                id="mobileMenuBtn"
                type="button"
                aria-label="Open menu"
                aria-expanded="false"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>

            <nav id="mainNav">

                <a href="index.html">
                    Home
                </a>

                <a href="?type=trending">
                    Trending
                </a>

                <div
                    class="category-wrapper"
                    id="categoryWrapper"
                >

                    <button
                        class="category-toggle"
                        id="categoryToggle"
                        type="button"
                        aria-expanded="false"
                    >

                        <span>
                            Categories
                        </span>

                        <span class="arrow">
                            ▼
                        </span>

                    </button>

                    <div
                        class="dropdown-menu"
                        id="categoryMenu"
                    >
                    </div>

                </div>

                <a href="#about">
                    About Us
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         HERO
    ========================= -->

    <section class="hero">

        <div class="hero-label">
            VNR CHOICEZ
        </div>

        <h1>
            FIND YOUR<br>
            NEXT CHOICE.
        </h1>

        <p>
            Discover useful products, trending finds and
            curated Shopee picks selected by VNR CHOICEZ.
        </p>

    </section>


    <!-- =========================
         SEARCH
    ========================= -->

    <section class="search-section">

        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                type="search"
                id="searchInput"
                placeholder="Search products, categories or keywords..."
                autocomplete="off"
            >

        </div>

    </section>


    <!-- =========================
         PRODUCTS
    ========================= -->

    <main>

        <div class="section-header">

            <h2 id="sectionTitle">
                All Products
            </h2>

            <span
                class="product-count"
                id="productCount"
            >
                0 products
            </span>

        </div>

        <div
            class="products-grid"
            id="productsGrid"
        >
        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer id="about">

        <div class="footer-logo">
            VNR CHOICEZ
        </div>

        <p>
            Discover. Choose. Shop.
        </p>

    </footer>


    <!-- =========================
         SUPABASE
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>


    <script>

        /* =========================
           SUPABASE CHECK
        ========================= */

        if (
            typeof SUPABASE_URL === "undefined" ||
            typeof SUPABASE_ANON_KEY === "undefined"
        ) {

            console.error(
                "Supabase configuration is missing."
            );

        }

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =========================
           DOM
        ========================= */

        const mobileMenuBtn =
            document.getElementById(
                "mobileMenuBtn"
            );

        const mainNav =
            document.getElementById(
                "mainNav"
            );

        const categoryWrapper =
            document.getElementById(
                "categoryWrapper"
            );

        const categoryToggle =
            document.getElementById(
                "categoryToggle"
            );

        const categoryMenu =
            document.getElementById(
                "categoryMenu"
            );

        const productsGrid =
            document.getElementById(
                "productsGrid"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const sectionTitle =
            document.getElementById(
                "sectionTitle"
            );

        const productCount =
            document.getElementById(
                "productCount"
            );


        /* =========================
           STATE
        ========================= */

        let allProducts = [];
        let allCategories = [];

        let currentFilter = "all";
        let currentSearch = "";


        /* =========================
           URL FILTER
        ========================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const urlType =
            urlParams.get("type");

        if (urlType === "trending") {
            currentFilter = "trending";
        }


        /* =========================
           HELPERS
        ========================= */

        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function formatPrice(price) {

            if (
                price === null ||
                price === undefined ||
                price === ""
            ) {
                return "";
            }

            const number =
                Number(price);

            if (Number.isNaN(number)) {
                return escapeHtml(price);
            }

            return `RM ${number.toFixed(2)}`;
        }


        /* =========================
           HEADER SCROLL
        ========================= */

        let lastScrollY = 0;

        window.addEventListener(
            "scroll",
            function () {

                const currentScroll =
                    window.scrollY;

                if (
                    currentScroll > 10
                ) {

                    document
                        .querySelector("header")
                        .style.background =
                        "rgba(7,7,7,0.92)";

                } else {

                    document
                        .querySelector("header")
                        .style.background =
                        "rgba(7,7,7,0.82)";

                }

                lastScrollY =
                    currentScroll;

            },
            {
                passive: true
            }
        );


        /* =========================
           MOBILE MENU
        ========================= */

        mobileMenuBtn.addEventListener(
            "click",
            function () {

                const isOpen =
                    mainNav.classList.toggle(
                        "mobile-open"
                    );

                mobileMenuBtn.classList.toggle(
                    "active",
                    isOpen
                );

                mobileMenuBtn.setAttribute(
                    "aria-expanded",
                    String(isOpen)
                );

            }
        );


        /* =========================
           CATEGORY DROPDOWN
        ========================= */

        categoryToggle.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                const isOpen =
                    categoryWrapper.classList.toggle(
                        "open"
                    );

                categoryToggle.setAttribute(
                    "aria-expanded",
                    String(isOpen)
                );

            }
        );


        document.addEventListener(
            "click",
            function (event) {

                if (
                    !categoryWrapper.contains(
                        event.target
                    )
                ) {

                    categoryWrapper.classList.remove(
                        "open"
                    );

                    categoryToggle.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }

            }
        );


        /* =========================
           CLOSE MOBILE MENU
           AFTER NAV LINK CLICK
        ========================= */

        mainNav.addEventListener(
            "click",
            function (event) {

                const link =
                    event.target.closest(
                        "a"
                    );

                if (!link) {
                    return;
                }

                mainNav.classList.remove(
                    "mobile-open"
                );

                mobileMenuBtn.classList.remove(
                    "active"
                );

                mobileMenuBtn.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }
        );


        /* =========================
           LOAD CATEGORIES
        ========================= */

        async function loadCategories() {

            const {
                data,
                error
            } = await supabaseClient
                .from("categories")
                .select("*")
                .order("name", {
                    ascending: true
                });


            if (error) {

                console.error(
                    "Category loading error:",
                    error
                );

                /*
                 * Fallback categories
                 */

                allCategories = [
                    {
                        id: "accessories",
                        name: "Accessories"
                    },
                    {
                        id: "beauty",
                        name: "Beauty"
                    },
                    {
                        id: "cookery",
                        name: "Cookery"
                    },
                    {
                        id: "fashion",
                        name: "Fashion"
                    },
                    {
                        id: "fragrance",
                        name: "Fragrance"
                    },
                    {
                        id: "gadget-tech",
                        name: "Gadget & Tech"
                    },
                    {
                        id: "gaming",
                        name: "Gaming"
                    },
                    {
                        id: "home-items",
                        name: "Home Items"
                    },
                    {
                        id: "random-useful-items",
                        name: "Random Useful Items"
                    },
                    {
                        id: "sports",
                        name: "Sports"
                    }
                ];

            } else {

                allCategories =
                    data || [];

            }

            renderCategoryMenu();

        }


        /* =========================
           RENDER CATEGORY MENU
        ========================= */

        function renderCategoryMenu() {

            categoryMenu.innerHTML = "";

            const allLink =
                document.createElement("a");

            allLink.href =
                "index.html";

            allLink.textContent =
                "All Products";

            categoryMenu.appendChild(
                allLink
            );


            allCategories.forEach(
                function (category) {

                    const link =
                        document.createElement("a");

                    link.href =
                        `?category=${encodeURIComponent(category.id || category.name)}`;

                    link.textContent =
                        category.name;

                    categoryMenu.appendChild(
                        link
                    );

                }
            );

        }


        /* =========================
           LOAD PRODUCTS
        ========================= */

        async function loadProducts() {

            productsGrid.innerHTML = `
                <div class="empty-state">
                    Loading products...
                </div>
            `;

            const {
                data,
                error
            } = await supabaseClient
                .from("products")
                .select(`
                    *,
                    categories (
                        id,
                        name
                    )
                `)
                .eq(
                    "status",
                    "published"
                )
                .order(
                    "sort_order",
                    {
                        ascending: true,
                        nullsFirst: false
                    }
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Product loading error:",
                    error
                );

                productsGrid.innerHTML = `
                    <div class="empty-state">
                        Unable to load products right now.
                    </div>
                `;

                productCount.textContent =
                    "0 products";

                return;
            }


            allProducts =
                data || [];

            applyFilters();

        }


        /* =========================
           FILTER PRODUCTS
        ========================= */

        function applyFilters() {

            let products =
                [...allProducts];


            if (
                currentFilter ===
                "trending"
            ) {

                products =
                    products.filter(
                        function (product) {

                            return (
                                product.is_trending ===
                                true
                            );

                        }
                    );

                sectionTitle.textContent =
                    "Trending";

            }

            else if (
                currentFilter !==
                "all"
            ) {

                products =
                    products.filter(
                        function (product) {

                            const category =
                                product.categories;

                            if (!category) {
                                return false;
                            }

                            return (
                                String(
                                    category.id
                                ) ===
                                String(
                                    currentFilter
                                ) ||
                                String(
                                    category.name
                                ).toLowerCase() ===
                                String(
                                    currentFilter
                                ).toLowerCase()
                            );

                        }
                    );


                const selectedCategory =
                    allCategories.find(
                        function (category) {

                            return (
                                String(
                                    category.id
                                ) ===
                                String(
                                    currentFilter
                                )
                            );

                        }
                    );


                sectionTitle.textContent =
                    selectedCategory
                        ? selectedCategory.name
                        : "Products";

            }

            else {

                sectionTitle.textContent =
                    "All Products";

            }


            if (currentSearch.trim()) {

                const search =
                    currentSearch
                        .toLowerCase()
                        .trim();

                products =
                    products.filter(
                        function (product) {

                            const name =
                                product.name ||
                                "";

                            const description =
                                product.description ||
                                "";

                            const category =
                                product.categories
                                    ?.name ||
                                "";

                            return (
                                name
                                    .toLowerCase()
                                    .includes(search) ||

                                description
                                    .toLowerCase()
                                    .includes(search) ||

                                category
                                    .toLowerCase()
                                    .includes(search)
                            );

                        }
                    );

            }


            renderProducts(
                products
            );

        }


        /* =========================
           RENDER PRODUCTS
        ========================= */

        function renderProducts(
            products
        ) {

            productCount.textContent =
                `${products.length} ${
                    products.length === 1
                        ? "product"
                        : "products"
                }`;


            if (!products.length) {

                productsGrid.innerHTML = `
                    <div class="empty-state">
                        No products found.
                    </div>
                `;

                return;

            }


            productsGrid.innerHTML =
                products
                    .map(
                        function (product) {

                            const image =
                                product.image_url ||
                                product.image_path ||
                                "cropped_circle_image.png";

                            const category =
                                product.categories
                                    ?.name ||
                                "VNR CHOICEZ";

                            const name =
                                product.name ||
                                "Product";

                            const description =
                                product.description ||
                                "";

                            const price =
                                formatPrice(
                                    product.price
                                );

                            const link =
                                product.affiliate_url ||
                                product.shopee_link ||
                                "#";


                            return `
                                <article class="product-card">

                                    <a
                                        href="${escapeHtml(link)}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >

                                        <div class="product-image-wrap">

                                            <img
                                                class="product-image"
                                                src="${escapeHtml(image)}"
                                                alt="${escapeHtml(name)}"
                                                loading="lazy"
                                                onerror="
                                                    this.onerror=null;
                                                    this.src='cropped_circle_image.png';
                                                "
                                            >

                                        </div>

                                    </a>


                                    <div class="product-info">

                                        <div class="product-category">
                                            ${escapeHtml(category)}
                                        </div>

                                        <div class="product-name">
                                            ${escapeHtml(name)}
                                        </div>

                                        ${
                                            description
                                                ? `
                                                    <div class="product-description">
                                                        ${escapeHtml(description)}
                                                    </div>
                                                `
                                                : ""
                                        }

                                        <div class="product-bottom">

                                            <div class="product-price">
                                                ${price}
                                            </div>

                                            <a
                                                class="view-product"
                                                href="${escapeHtml(link)}"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                            >
                                                View Product
                                            </a>

                                        </div>

                                    </div>

                                </article>
                            `;

                        }
                    )
                    .join("");

        }


        /* =========================
           SEARCH
        ========================= */

        let searchTimer;

        searchInput.addEventListener(
            "input",
            function (event) {

                clearTimeout(
                    searchTimer
                );

                currentSearch =
                    event.target.value;


                searchTimer =
                    setTimeout(
                        function () {

                            applyFilters();

                        },
                        250
                    );

            }
        );


        /* =========================
           INITIAL FILTER
        ========================= */

        if (
            urlType ===
            "trending"
        ) {

            currentFilter =
                "trending";

        }


        /* =========================
           CATEGORY FROM URL
        ========================= */

        const urlCategory =
            urlParams.get(
                "category"
            );

        if (urlCategory) {

            currentFilter =
                urlCategory;

        }


        /* =========================
           INITIALIZE
        ========================= */

        async function initialize() {

            await loadCategories();

            await loadProducts();

        }


        initialize();

    </script>

</body>

</html>
