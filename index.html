<script>

"use strict";


// ========================================
// CHECK SUPABASE CLIENT
// ========================================

if (
    typeof supabaseClient === "undefined" ||
    !supabaseClient ||
    typeof supabaseClient.from !== "function"
) {

    console.error(
        "SUPABASE CLIENT ERROR: supabaseClient is not available or is not a valid Supabase client."
    );

}


// ========================================
// URL PARAMETER
// ========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const selectedType =
    params.get("type") || "Trending";


// ========================================
// ELEMENTS
// ========================================

const productGrid =
    document.getElementById("productGrid");

const searchInput =
    document.getElementById("searchInput");

const categoryTitle =
    document.getElementById("categoryTitle");

const categoryDescription =
    document.getElementById("categoryDescription");

const categoryNav =
    document.getElementById("categoryNav");

const loading =
    document.getElementById("loading");

const errorMessage =
    document.getElementById("errorMessage");

const noResults =
    document.getElementById("noResults");


// ========================================
// DATA
// ========================================

let allProducts = [];

let allCategories = [];

let currentProducts = [];


// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ========================================
// IMAGE
// ========================================

function getImageUrl(product) {

    return (
        product.image_url ||
        product.image_path ||
        ""
    );

}


// ========================================
// CATEGORY INFO
// ========================================

function getCategoryInfo(name) {

    if (name === "Trending") {

        return {
            title: "🔥 Trending Finds",
            description:
                "Discover products currently featured in our trending finds."
        };

    }


    return {
        title: name,
        description:
            "Discover useful products and curated finds from VNR CHOICEZ."
    };

}


// ========================================
// LOAD CATEGORIES
// ========================================

async function loadCategories() {

    console.log(
        "VNR CHOICEZ: Loading categories..."
    );


    const result =
        await supabaseClient
            .from("categories")
            .select("id,name,slug")
            .order("name", {
                ascending: true
            });


    if (result.error) {

        console.error(
            "CATEGORY ERROR:",
            result.error
        );

        /*
         * Fallback categories.
         * This keeps navigation working even if
         * the categories query fails.
         */

        allCategories = [

            {
                id: null,
                name: "Gadget & Tech",
                slug: "gadgets-tech"
            },

            {
                id: null,
                name: "Accessories",
                slug: "accessories"
            },

            {
                id: null,
                name: "Fashion",
                slug: "fashion"
            },

            {
                id: null,
                name: "Cookery",
                slug: "cookery"
            },

            {
                id: null,
                name: "Beauty",
                slug: "beauty"
            },

            {
                id: null,
                name: "Home Items",
                slug: "home-items"
            },

            {
                id: null,
                name: "Fragrance",
                slug: "fragrance"
            },

            {
                id: null,
                name: "Sports",
                slug: "sports"
            },

            {
                id: null,
                name: "Gaming",
                slug: "gaming"
            },

            {
                id: null,
                name: "Random Useful Items",
                slug: "random-useful-items"
            }

        ];

    } else {

        allCategories =
            Array.isArray(result.data)
                ? result.data
                : [];

    }


    renderNavigation();

    updateCategoryHeading();

}


// ========================================
// NAVIGATION
// ========================================

function renderNavigation() {

    let html = `

        <a href="index.html">
            Home
        </a>

        <a href="category.html?type=Trending">
            Trending
        </a>

    `;


    allCategories.forEach(category => {

        html += `

            <a
                href="category.html?type=${encodeURIComponent(category.name)}"
            >
                ${escapeHtml(category.name)}
            </a>

        `;

    });


    html += `

        <a href="about.html">
            ABOUT US
        </a>

    `;


    categoryNav.innerHTML = html;

}


// ========================================
// HEADING
// ========================================

function updateCategoryHeading() {

    const info =
        getCategoryInfo(selectedType);


    categoryTitle.textContent =
        info.title;


    categoryDescription.textContent =
        info.description;


    document.title =
        `${selectedType} | VNR CHOICEZ`;

}


// ========================================
// LOAD PRODUCTS
// ========================================

async function loadProducts() {

    console.log(
        "VNR CHOICEZ: Loading published products..."
    );


    const result =
        await supabaseClient
            .from("products")
            .select(`
                id,
                name,
                description,
                price,
                image_url,
                image_path,
                affiliate_url,
                shopee_link,
                status,
                featured,
                views,
                clicks,
                created_at,
                sort_order,
                category,
                category_id
            `)
            .eq("status", "published")
            .order("sort_order", {
                ascending: true,
                nullsFirst: false
            })
            .order("created_at", {
                ascending: false
            });


    if (result.error) {

        console.error(
            "PRODUCT ERROR:",
            result.error
        );

        console.error(
            "PRODUCT ERROR MESSAGE:",
            result.error.message
        );

        console.error(
            "PRODUCT ERROR DETAILS:",
            result.error.details
        );

        console.error(
            "PRODUCT ERROR HINT:",
            result.error.hint
        );

        loading.style.display = "none";

        errorMessage.textContent =
            "Unable to load products. Check the browser Console for the exact Supabase error.";

        errorMessage.style.display = "block";

        return;

    }


    console.log(
        "VNR CHOICEZ: Products loaded:",
        result.data
    );


    allProducts =
        Array.isArray(result.data)
            ? result.data
            : [];


    allProducts =
        allProducts.map(product => {

            const category =
                allCategories.find(
                    item =>
                        item.id ===
                        product.category_id
                );


            return {

                ...product,

                categoryName:
                    category?.name ||
                    product.category ||
                    "Uncategorized"

            };

        });


    filterCategory();

}


// ========================================
// FILTER CATEGORY
// ========================================

function filterCategory() {

    if (selectedType === "Trending") {

        currentProducts =
            [...allProducts].sort(
                (a, b) => {

                    const featuredDifference =
                        Number(b.featured || false) -
                        Number(a.featured || false);


                    if (
                        featuredDifference !== 0
                    ) {

                        return featuredDifference;

                    }


                    const clickDifference =
                        Number(b.clicks || 0) -
                        Number(a.clicks || 0);


                    if (
                        clickDifference !== 0
                    ) {

                        return clickDifference;

                    }


                    return (
                        new Date(b.created_at || 0) -
                        new Date(a.created_at || 0)
                    );

                }
            );

    } else {

        currentProducts =
            allProducts.filter(
                product => {

                    const categoryName =
                        String(
                            product.categoryName || ""
                        )
                        .trim()
                        .toLowerCase();


                    const selected =
                        String(
                            selectedType || ""
                        )
                        .trim()
                        .toLowerCase();


                    return (
                        categoryName === selected
                    );

                }
            );

    }


    loading.style.display = "none";


    renderProducts(
        currentProducts
    );

}


// ========================================
// RENDER PRODUCTS
// ========================================

function renderProducts(products) {

    productGrid.innerHTML = "";

    noResults.style.display = "none";


    if (!products.length) {

        noResults.style.display = "block";

        return;

    }


    products.forEach(product => {

        productGrid.appendChild(
            createProductCard(product)
        );

    });

}


// ========================================
// CREATE PRODUCT CARD
// ========================================

function createProductCard(product) {

    const card =
        document.createElement("article");


    card.className =
        "product";


    const name =
        product.name ||
        "Unnamed Product";


    const description =
        product.description ||
        "Useful product worth checking out.";


    const category =
        product.categoryName ||
        "Uncategorized";


    const image =
        getImageUrl(product);


    const affiliate =
        product.affiliate_url ||
        product.shopee_link ||
        "";


    const numericPrice =
        Number(product.price);


    const price =
        Number.isFinite(numericPrice)
            ? numericPrice.toFixed(2)
            : "0.00";


    card.innerHTML = `

        ${
            image
                ? `
                    <img
                        class="product-image"
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(name)}"
                        loading="lazy"
                        onerror="this.style.display='none';"
                    >
                `
                : ""
        }

        <div class="product-info">

            <h3 class="product-name">
                ${escapeHtml(name)}
            </h3>

            <div class="product-description">
                ${escapeHtml(description)}
            </div>

            <div class="product-category">
                ${escapeHtml(category)}
            </div>

            <div class="product-price">
                RM${price}
            </div>

            ${
                affiliate
                    ? `
                        <a
                            class="buy-button"
                            href="${escapeHtml(affiliate)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            View on Shopee
                        </a>
                    `
                    : `
                        <div class="buy-button">
                            Product link unavailable
                        </div>
                    `
            }

        </div>

    `;


    return card;

}


// ========================================
// SEARCH
// ========================================

searchInput.addEventListener(
    "input",
    function () {

        const term =
            this.value
                .toLowerCase()
                .trim();


        if (!term) {

            renderProducts(
                currentProducts
            );

            return;

        }


        const filtered =
            currentProducts.filter(
                product => {

                    const text = [

                        product.name,

                        product.description,

                        product.categoryName

                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                    return text.includes(term);

                }
            );


        renderProducts(
            filtered
        );

    }
);


// ========================================
// INIT
// ========================================

async function init() {

    try {

        console.log(
            "VNR CHOICEZ: Initializing..."
        );


        if (
            typeof supabaseClient === "undefined" ||
            !supabaseClient ||
            typeof supabaseClient.from !== "function"
        ) {

            throw new Error(
                "supabaseClient is not available. Check config.js."
            );

        }


        /*
         * Set heading immediately.
         * User should never see Loading... as
         * the category title.
         */

        updateCategoryHeading();


        await loadCategories();

        await loadProducts();


        console.log(
            "VNR CHOICEZ: Initialization complete."
        );

    } catch (error) {

        console.error(
            "INIT ERROR:",
            error
        );


        loading.style.display = "none";

        errorMessage.textContent =
            `Unable to load products: ${error.message || error}`;

        errorMessage.style.display = "block";

    }

}


init();

</script>
