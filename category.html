<script>

"use strict";


/* =========================================================
   SUPABASE CHECK
========================================================= */

if (
    typeof window.supabase === "undefined" ||
    typeof supabaseClient === "undefined"
) {

    throw new Error(
        "VNR CHOICEZ: Supabase library/config.js failed to load."
    );

}


/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const selectedType =
    params.get("type") || "Trending";


/* =========================================================
   ELEMENTS
========================================================= */

const productGrid =
    document.getElementById(
        "productGrid"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const categoryTitle =
    document.getElementById(
        "categoryTitle"
    );

const categoryDescription =
    document.getElementById(
        "categoryDescription"
    );

const categoryNav =
    document.getElementById(
        "categoryNav"
    );

const loading =
    document.getElementById(
        "loading"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const noResults =
    document.getElementById(
        "noResults"
    );


/* =========================================================
   REQUIRED CATEGORIES
========================================================= */

const REQUIRED_CATEGORIES = [

    {
        name: "Gadget & Tech",
        slug: "gadgets-tech"
    },

    {
        name: "Accessories",
        slug: "accessories"
    },

    {
        name: "Fashion",
        slug: "fashion"
    },

    {
        name: "Cookery",
        slug: "cookery"
    },

    {
        name: "Beauty",
        slug: "beauty"
    },

    {
        name: "Home Items",
        slug: "home-items"
    },

    {
        name: "Fragrance",
        slug: "fragrance"
    },

    {
        name: "Sports",
        slug: "sports"
    },

    {
        name: "Gaming",
        slug: "gaming"
    },

    {
        name: "Random Useful Items",
        slug: "random-useful-items"
    }

];


let allProducts = [];

let allCategories = [];

let currentProducts = [];


/* =========================================================
   IMMEDIATELY SET HEADING
========================================================= */

function setInitialHeading() {

    if (
        selectedType.toLowerCase() ===
        "trending"
    ) {

        categoryTitle.textContent =
            "🔥 Trending Finds";


        categoryDescription.textContent =
            "Discover products currently featured in our trending finds.";


        document.title =
            "Trending | VNR CHOICEZ";


        return;

    }


    categoryTitle.textContent =
        selectedType;


    categoryDescription.textContent =
        "Discover useful products and curated finds from VNR CHOICEZ.";


    document.title =
        `${selectedType} | VNR CHOICEZ`;

}


setInitialHeading();


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================================
   DATABASE ERROR FORMAT
========================================================= */

function formatDatabaseError(error, location) {

    console.error(
        `VNR CHOICEZ ${location} ERROR`,
        error
    );


    const code =
        error?.code || "UNKNOWN";

    const message =
        error?.message ||
        "Unknown database error";

    const details =
        error?.details || "";

    const hint =
        error?.hint || "";


    return `
        <strong>VNR CHOICEZ DATABASE ERROR</strong>

        <br><br>

        Code: ${escapeHtml(code)}

        <br>

        Message: ${escapeHtml(message)}

        ${
            details
                ? `<br>Details: ${escapeHtml(details)}`
                : ""
        }

        ${
            hint
                ? `<br>Hint: ${escapeHtml(hint)}`
                : ""
        }

        <br><br>

        Open your browser console with
        <strong>F12 → Console</strong>
        for the full error.
    `;

}


/* =========================================================
   IMAGE URL
========================================================= */

function getImageUrl(product) {

    if (product.image_url) {

        return String(
            product.image_url
        ).trim();

    }


    if (product.image_path) {

        const path =
            String(
                product.image_path
            ).trim();


        if (
            supabaseClient &&
            supabaseClient.storage
        ) {

            const result =
                supabaseClient.storage
                    .from("product-images")
                    .getPublicUrl(path);


            if (
                result &&
                result.data &&
                result.data.publicUrl
            ) {

                return result.data.publicUrl;

            }

        }


        return path;

    }


    return "";

}


/* =========================================================
   NAVIGATION
========================================================= */

function renderNavigation() {

    let html = "";


    html += `
        <a href="index.html">
            Home
        </a>
    `;


    html += `
        <a href="category.html?type=Trending">
            Trending
        </a>
    `;


    REQUIRED_CATEGORIES.forEach(
        requiredCategory => {

            const databaseCategory =
                allCategories.find(
                    category =>
                        String(
                            category.slug || ""
                        ).toLowerCase() ===
                        requiredCategory.slug.toLowerCase()
                );


            const categoryName =
                databaseCategory?.name ||
                requiredCategory.name;


            html += `
                <a
                    href="category.html?type=${encodeURIComponent(categoryName)}"
                >
                    ${escapeHtml(categoryName)}
                </a>
            `;

        }
    );


    html += `
        <a href="about.html">
            ABOUT US
        </a>
    `;


    categoryNav.innerHTML =
        html;

}


/* =========================================================
   LOAD CATEGORIES
========================================================= */

async function loadCategories() {

    /*
     * Render required navigation immediately.
     */

    allCategories =
        REQUIRED_CATEGORIES.map(
            category => ({
                ...category
            })
        );


    renderNavigation();


    try {

        const result =
            await supabaseClient

                .from("categories")

                .select(
                    "id,name,slug"
                )

                .order(
                    "name",
                    {
                        ascending: true
                    }
                );


        if (result.error) {

            console.warn(
                "VNR CHOICEZ: categories query failed.",
                result.error
            );

            return;

        }


        if (
            Array.isArray(result.data) &&
            result.data.length > 0
        ) {

            allCategories =
                result.data;


            renderNavigation();

        }

    }

    catch (error) {

        console.warn(
            "VNR CHOICEZ: categories exception.",
            error
        );

    }

}


/* =========================================================
   CONNECT CATEGORY NAME
========================================================= */

function attachCategoryName(product) {

    let categoryName = "";


    if (product.category_id) {

        const linkedCategory =
            allCategories.find(
                category =>
                    String(category.id) ===
                    String(product.category_id)
            );


        if (linkedCategory) {

            categoryName =
                linkedCategory.name;

        }

    }


    if (
        !categoryName &&
        product.category
    ) {

        categoryName =
            product.category;

    }


    if (!categoryName) {

        categoryName =
            "Uncategorized";

    }


    return {

        ...product,

        categoryName

    };

}


/* =========================================================
   LOAD PUBLISHED PRODUCTS
========================================================= */

async function loadProducts() {

    loading.style.display =
        "block";

    errorMessage.style.display =
        "none";

    noResults.style.display =
        "none";

    productGrid.innerHTML =
        "";


    try {

        const result =
            await supabaseClient

                .from("products")

                .select(`
                    id,
                    category,
                    category_id,
                    name,
                    price,
                    shopee_link,
                    affiliate_url,
                    image_url,
                    image_path,
                    description,
                    status,
                    featured,
                    views,
                    clicks,
                    created_at,
                    updated_at,
                    sort_order
                `)

                .eq(
                    "status",
                    "published"
                )

                .order(
                    "sort_order",
                    {
                        ascending: true,
                        nullsFirst: false
                    }
                )

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (result.error) {

            loading.style.display =
                "none";


            errorMessage.innerHTML =
                formatDatabaseError(
                    result.error,
                    "PRODUCT DATABASE"
                );


            errorMessage.style.display =
                "block";


            return;

        }


        allProducts =
            Array.isArray(result.data)
                ? result.data.map(
                    attachCategoryName
                )
                : [];


        loading.style.display =
            "none";


        filterCategory();


        console.log(
            "VNR CHOICEZ: Published products loaded:",
            allProducts.length
        );

    }

    catch (error) {

        loading.style.display =
            "none";


        errorMessage.innerHTML =
            formatDatabaseError(
                error,
                "PRODUCT EXCEPTION"
            );


        errorMessage.style.display =
            "block";

    }

}


/* =========================================================
   FILTER CATEGORY
========================================================= */

function filterCategory() {

    if (
        selectedType.toLowerCase() ===
        "trending"
    ) {

        /*
         * Trending is NOT a database category.
         *
         * Priority:
         * 1. Featured
         * 2. Clicks
         * 3. Views
         * 4. Newest
         */

        currentProducts =
            [...allProducts].sort(
                (a, b) => {

                    const featuredDifference =
                        Number(
                            b.featured || false
                        ) -
                        Number(
                            a.featured || false
                        );


                    if (
                        featuredDifference !== 0
                    ) {

                        return featuredDifference;

                    }


                    const clicksDifference =
                        Number(
                            b.clicks || 0
                        ) -
                        Number(
                            a.clicks || 0
                        );


                    if (
                        clicksDifference !== 0
                    ) {

                        return clicksDifference;

                    }


                    const viewsDifference =
                        Number(
                            b.views || 0
                        ) -
                        Number(
                            a.views || 0
                        );


                    if (
                        viewsDifference !== 0
                    ) {

                        return viewsDifference;

                    }


                    return (
                        new Date(
                            b.created_at || 0
                        ) -
                        new Date(
                            a.created_at || 0
                        )
                    );

                }
            );

    }

    else {

        const selectedCategory =
            allCategories.find(
                category =>
                    String(
                        category.name || ""
                    ).toLowerCase() ===
                    selectedType.toLowerCase()
            );


        currentProducts =
            allProducts.filter(
                product => {

                    /*
                     * Primary matching:
                     * category_id
                     */

                    if (
                        selectedCategory?.id &&
                        product.category_id
                    ) {

                        if (
                            String(
                                product.category_id
                            ) ===
                            String(
                                selectedCategory.id
                            )
                        ) {

                            return true;

                        }

                    }


                    /*
                     * Secondary matching:
                     * category name
                     */

                    return (
                        String(
                            product.categoryName || ""
                        ).toLowerCase() ===
                        selectedType.toLowerCase()
                    );

                }
            );

    }


    loading.style.display =
        "none";


    renderProducts(
        currentProducts
    );

}


/* =========================================================
   CREATE PRODUCT CARD
========================================================= */

function createProductCard(product) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "product";


    const name =
        product.name ||
        "Unnamed Product";


    const description =
        product.description ||
        "Useful product worth checking out.";


    const category =
        product.categoryName ||
        "Uncategorized";


    const image =
        getImageUrl(product);


    const affiliate =
        product.affiliate_url ||
        product.shopee_link ||
        "";


    const numericPrice =
        Number(product.price);


    const price =
        Number.isFinite(
            numericPrice
        )
            ? numericPrice.toFixed(2)
            : "0.00";


    card.innerHTML = `

        ${
            image
                ? `
                    <img
                        class="product-image"
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(name)}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                        "
                    >
                `
                : ""
        }


        <div class="product-info">

            <h3 class="product-name">
                ${escapeHtml(name)}
            </h3>


            <div class="product-description">
                ${escapeHtml(description)}
            </div>


            <div class="product-category">
                ${escapeHtml(category)}
            </div>


            <div class="product-price">
                RM${price}
            </div>


            ${
                affiliate
                    ? `
                        <a
                            class="buy-button"
                            href="${escapeHtml(affiliate)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            View on Shopee
                        </a>
                    `
                    : `
                        <div class="buy-button">
                            Product link unavailable
                        </div>
                    `
            }

        </div>

    `;


    return card;

}


/* =========================================================
   RENDER
========================================================= */

function renderProducts(products) {

    productGrid.innerHTML =
        "";

    noResults.style.display =
        "none";


    if (
        !Array.isArray(products) ||
        products.length === 0
    ) {

        noResults.textContent =
            selectedType.toLowerCase() ===
            "trending"

                ? "No trending products found."

                : `No published products found in ${selectedType}.`;


        noResults.style.display =
            "block";


        return;

    }


    products.forEach(
        product => {

            productGrid.appendChild(
                createProductCard(product)
            );

        }
    );

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function () {

        const term =
            this.value
                .toLowerCase()
                .trim();


        if (!term) {

            renderProducts(
                currentProducts
            );

            return;

        }


        const filtered =
            currentProducts.filter(
                product => {

                    const searchableText = [

                        product.name,

                        product.description,

                        product.categoryName,

                        product.category

                    ]

                        .filter(Boolean)

                        .join(" ")

                        .toLowerCase();


                    return searchableText
                        .includes(term);

                }
            );


        renderProducts(
            filtered
        );

    }
);


/* =========================================================
   INIT
========================================================= */

async function init() {

    console.log(
        "VNR CHOICEZ: category page starting..."
    );


    await loadCategories();


    await loadProducts();


    console.log(
        "VNR CHOICEZ: category page initialized."
    );

}


/* =========================================================
   START
========================================================= */

init();

</script>
