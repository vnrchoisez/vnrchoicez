<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VNR CHOICEZ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #ffffff;
            color: #111111;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            border-bottom: 1px solid #e5e5e5;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;
            padding: 22px 30px 16px;
        }

        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .brand {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        .tagline {
            font-size: 11px;
            color: #777;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .search-box {
            width: 360px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 13px 18px;
            border: 1px solid #dddddd;
            border-radius: 30px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }

        .search-box input:focus {
            border-color: #111111;
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            margin-top: 18px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        nav::-webkit-scrollbar {
            display: none;
        }

        .nav-list {
            display: flex;
            align-items: center;
            gap: 24px;
            white-space: nowrap;
            list-style: none;
        }

        .nav-list a {
            font-size: 11px;
            font-weight: 600;
            color: #555555;
            transition: 0.2s;
        }

        .nav-list a:hover {
            color: #000000;
        }

        .nav-list a.active {
            color: #000000;
            font-weight: 800;
        }

        .about-link {
            margin-left: auto;
            font-weight: 800 !important;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1400px;
            margin: auto;
            padding: 55px 30px 80px;
        }

        .category-heading {
            margin-bottom: 35px;
        }

        .category-heading h1 {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .category-heading p {
            margin-top: 8px;
            font-size: 12px;
            color: #777777;
        }

        /* =========================
           PRODUCT GRID
        ========================= */

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 32px 22px;
        }

        .product-card {
            border: 1px solid #eeeeee;
            background: #ffffff;
            transition: 0.25s ease;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.07);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f6f6f6;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 18px;
        }

        .product-category {
            font-size: 9px;
            font-weight: 700;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 7px;
        }

        .product-description {
            font-size: 11px;
            color: #777777;
            line-height: 1.6;
            min-height: 35px;
            margin-bottom: 14px;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .product-price {
            font-size: 14px;
            font-weight: 800;
        }

        .shopee-btn {
            background: #111111;
            color: #ffffff;
            padding: 9px 13px;
            font-size: 9px;
            font-weight: 700;
            transition: 0.2s;
            white-space: nowrap;
        }

        .shopee-btn:hover {
            background: #333333;
        }

        /* =========================
           STATES
        ========================= */

        .loading,
        .error-message,
        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            font-size: 13px;
            color: #777777;
        }

        .error-message {
            color: #c62828;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top: 1px solid #e5e5e5;
            background: #ffffff;
        }

        .footer-inner {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .footer-brand {
            font-size: 14px;
            font-weight: 800;
        }

        .footer-text {
            font-size: 10px;
            color: #888888;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 800px) {
            .top-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-box {
                width: 100%;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            main {
                padding: 40px 18px 60px;
            }

            .header-inner {
                padding: 18px;
            }

            .nav-list {
                gap: 18px;
            }

            .about-link {
                margin-left: 0;
            }

            .footer-inner {
                padding: 25px 18px;
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 500px) {
            .product-grid {
                grid-template-columns: 1fr 1fr;
            }

            .product-info {
                padding: 13px;
            }

            .product-name {
                font-size: 12px;
            }

            .product-description {
                font-size: 10px;
            }

            .product-bottom {
                flex-direction: column;
                align-items: flex-start;
            }

            .shopee-btn {
                width: 100%;
                text-align: center;
            }

            .category-heading h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="top-row">

            <div>
                <a href="index.html" class="brand">
                    VNR CHOICEZ
                </a>

                <div class="tagline">
                    FIND IT. CHOOSE IT. LOVE IT.
                </div>
            </div>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search products..."
                    autocomplete="off"
                >
            </div>

        </div>

        <nav>
            <ul class="nav-list" id="categoryNav">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="category.html?type=Trending">
                        Trending
                    </a>
                </li>

                <!-- Categories loaded from Supabase -->

            </ul>
        </nav>

    </div>
</header>


<main>

    <section class="category-heading">

        <h1 id="categoryTitle">
            Loading...
        </h1>

        <p id="categoryDescription">
            Discover our latest picks and recommendations.
        </p>

    </section>


    <section
        class="product-grid"
        id="productGrid"
    >

        <div class="loading">
            Loading products...
        </div>

    </section>

</main>


<footer>

    <div class="footer-inner">

        <div class="footer-brand">
            VNR CHOICEZ
        </div>

        <div class="footer-text">
            © 2026 VNR CHOICEZ. All rights reserved.
        </div>

    </div>

</footer>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- YOUR CONFIG -->
<script src="config.js"></script>


<script>
"use strict";

/* =========================================================
   SUPABASE CHECK
========================================================= */

if (
    typeof window.supabase === "undefined" ||
    typeof supabaseClient === "undefined"
) {
    throw new Error(
        "VNR CHOICEZ: Supabase library/config.js failed to load."
    );
}


/* =========================================================
   REQUIRED CATEGORIES
========================================================= */

const REQUIRED_CATEGORIES = [
    "Gadget & Tech",
    "Accessories",
    "Fashion",
    "Cookery",
    "Beauty",
    "Home Items",
    "Fragrance",
    "Sports",
    "Gaming",
    "Random Useful Items"
];


/* =========================================================
   DOM
========================================================= */

const categoryNav = document.getElementById("categoryNav");
const categoryTitle = document.getElementById("categoryTitle");
const categoryDescription = document.getElementById("categoryDescription");
const productGrid = document.getElementById("productGrid");
const searchInput = document.getElementById("searchInput");


/* =========================================================
   GET CATEGORY FROM URL
========================================================= */

const urlParams = new URLSearchParams(window.location.search);

const requestedType =
    urlParams.get("type") || "Gadget & Tech";


/* =========================================================
   STATE
========================================================= */

let currentCategory = requestedType;
let allProducts = [];
let categoryMap = new Map();


/* =========================================================
   ERROR FORMATTER
========================================================= */

function formatSupabaseError(error) {

    if (!error) {
        return "Unknown Supabase error.";
    }

    return (
        error.message ||
        error.details ||
        error.hint ||
        JSON.stringify(error)
    );
}


/* =========================================================
   SLUGIFY
========================================================= */

function slugify(value) {

    return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
}


/* =========================================================
   LOAD CATEGORIES
========================================================= */

async function loadCategories() {

    const {
        data,
        error
    } = await supabaseClient
        .from("categories")
        .select("id,name,slug")
        .order("name", { ascending: true });


    if (error) {

        console.error(
            "VNR CHOICEZ: Failed to load categories:",
            error
        );

        /*
         * Fallback supaya website masih boleh
         * bina navigation walaupun categories query gagal.
         */

        categoryMap.clear();

        REQUIRED_CATEGORIES.forEach((name) => {

            categoryMap.set(
                slugify(name),
                {
                    id: null,
                    name: name,
                    slug: slugify(name)
                }
            );

        });

        return;
    }


    categoryMap.clear();


    (data || []).forEach((category) => {

        categoryMap.set(
            category.slug || slugify(category.name),
            category
        );

    });


    /*
     * Pastikan semua required categories tetap wujud
     * dalam navigation.
     */

    REQUIRED_CATEGORIES.forEach((name) => {

        const slug = slugify(name);

        if (!categoryMap.has(slug)) {

            categoryMap.set(
                slug,
                {
                    id: null,
                    name: name,
                    slug: slug
                }
            );

        }

    });
}


/* =========================================================
   BUILD NAVIGATION
========================================================= */

function buildNavigation() {

    /*
     * Home + Trending sudah ada.
     * Buang category links lama supaya tak duplicate.
     */

    const existingCategoryLinks =
        categoryNav.querySelectorAll(
            "li[data-category-link]"
        );

    existingCategoryLinks.forEach((item) => {
        item.remove();
    });


    /*
     * Cari About Us.
     */

    let aboutItem =
        categoryNav.querySelector(".about-item");


    if (!aboutItem) {

        aboutItem = document.createElement("li");

        aboutItem.className = "about-item";

        aboutItem.innerHTML = `
            <a href="about.html" class="about-link">
                ABOUT US
            </a>
        `;

        categoryNav.appendChild(aboutItem);

    }


    /*
     * Tambah semua categories sebelum About Us.
     */

    const categories =
        Array.from(categoryMap.values());


    categories.sort((a, b) => {

        const indexA =
            REQUIRED_CATEGORIES.indexOf(a.name);

        const indexB =
            REQUIRED_CATEGORIES.indexOf(b.name);

        return (
            (indexA === -1 ? 999 : indexA) -
            (indexB === -1 ? 999 : indexB)
        );

    });


    categories.forEach((category) => {

        const li =
            document.createElement("li");

        li.setAttribute(
            "data-category-link",
            "true"
        );


        const a =
            document.createElement("a");


        a.href =
            `category.html?type=${encodeURIComponent(category.name)}`;


        a.textContent =
            category.name;


        /*
         * Active category
         */

        if (
            category.name.toLowerCase() ===
            currentCategory.toLowerCase()
        ) {

            a.classList.add("active");

        }


        li.appendChild(a);


        categoryNav.insertBefore(
            li,
            aboutItem
        );

    });


    /*
     * Active Trending
     */

    const trendingLink =
        categoryNav.querySelector(
            'a[href="category.html?type=Trending"]'
        );


    if (
        trendingLink &&
        currentCategory.toLowerCase() === "trending"
    ) {

        trendingLink.classList.add("active");

    }

}


/* =========================================================
   IMAGE URL
========================================================= */

function getImageUrl(product) {

    /*
     * Kalau image_url sudah direct URL,
     * guna terus.
     */

    if (
        product.image_url &&
        /^https?:\/\//i.test(product.image_url)
    ) {

        return product.image_url;

    }


    /*
     * Kalau ada image_path,
     * ambil dari Supabase Storage.
     */

    if (product.image_path) {

        const {
            data
        } =
            supabaseClient
                .storage
                .from("product-images")
                .getPublicUrl(product.image_path);


        return data?.publicUrl || "";

    }


    return "";
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(products) {

    productGrid.innerHTML = "";


    if (!products.length) {

        productGrid.innerHTML = `
            <div class="empty-message">
                No products found in this category.
            </div>
        `;

        return;
    }


    products.forEach((product) => {

        const card =
            document.createElement("article");

        card.className =
            "product-card";


        const imageUrl =
            getImageUrl(product);


        const imageHTML =
            imageUrl
                ? `
                    <img
                        src="${escapeHtml(imageUrl)}"
                        alt="${escapeHtml(product.name)}"
                        loading="lazy"
                        onerror="this.style.display='none';"
                    >
                  `
                : "";


        card.innerHTML = `

            <div class="product-image">
                ${imageHTML}
            </div>

            <div class="product-info">

                <div class="product-category">
                    ${escapeHtml(
                        product.category_name ||
                        product.category ||
                        "Product"
                    )}
                </div>

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div class="product-description">
                    ${escapeHtml(
                        product.description ||
                        "No description available."
                    )}
                </div>

                <div class="product-bottom">

                    <div class="product-price">
                        RM ${Number(product.price || 0).toFixed(2)}
                    </div>

                    <a
                        class="shopee-btn"
                        href="${escapeHtml(
                            product.affiliate_url ||
                            product.shopee_link ||
                            "#"
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                        data-product-id="${escapeHtml(product.id)}"
                    >
                        VIEW ON SHOPEE
                    </a>

                </div>

            </div>

        `;


        /*
         * Click tracking
         */

        const shopeeButton =
            card.querySelector(".shopee-btn");


        if (
            shopeeButton &&
            product.id
        ) {

            shopeeButton.addEventListener(
                "click",
                () => {

                    trackClick(product.id);

                }
            );

        }


        productGrid.appendChild(card);

    });

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {

    productGrid.innerHTML = `
        <div class="loading">
            Loading products...
        </div>
    `;


    /*
     * Ambil published products.
     *
     * category relation digunakan jika ada.
     */

    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select(`
                id,
                category,
                category_id,
                name,
                price,
                shopee_link,
                affiliate_url,
                image_url,
                image_path,
                description,
                is_trending,
                featured,
                views,
                clicks,
                sort_order,
                status,
                created_at,
                updated_at
            `)
            .eq("status", "published");


    if (error) {

        console.error(
            "VNR CHOICEZ: Failed to load products:",
            error
        );

        productGrid.innerHTML = `
            <div class="error-message">
                Failed to load products.<br>
                ${escapeHtml(formatSupabaseError(error))}
            </div>
        `;

        return;

    }


    allProducts =
        (data || []).map((product) => {

            let categoryName =
                product.category || "";


            /*
             * Kalau category_id ada,
             * cari nama category dari categoryMap.
             */

            if (product.category_id) {

                const category =
                    Array.from(
                        categoryMap.values()
                    ).find(
                        (item) =>
                            item.id ===
                            product.category_id
                    );


                if (category) {

                    categoryName =
                        category.name;

                }

            }


            return {
                ...product,
                category_name:
                    categoryName
            };

        });


    applyFilter();

}


/* =========================================================
   CATEGORY MATCH
========================================================= */

function matchesCategory(product) {

    if (
        currentCategory.toLowerCase() ===
        "trending"
    ) {

        return true;

    }


    const selected =
        currentCategory
            .trim()
            .toLowerCase();


    const productCategory =
        String(
            product.category_name ||
            product.category ||
            ""
        )
        .trim()
        .toLowerCase();


    return (
        productCategory === selected
    );

}


/* =========================================================
   SORT TRENDING
========================================================= */

function sortTrending(products) {

    return [...products].sort(
        (a, b) => {

            /*
             * Featured dahulu
             */

            const featuredA =
                a.featured ? 1 : 0;

            const featuredB =
                b.featured ? 1 : 0;


            if (
                featuredA !== featuredB
            ) {

                return (
                    featuredB -
                    featuredA
                );

            }


            /*
             * Clicks
             */

            const clicksA =
                Number(a.clicks || 0);

            const clicksB =
                Number(b.clicks || 0);


            if (
                clicksA !== clicksB
            ) {

                return (
                    clicksB -
                    clicksA
                );

            }


            /*
             * Views
             */

            const viewsA =
                Number(a.views || 0);

            const viewsB =
                Number(b.views || 0);


            if (
                viewsA !== viewsB
            ) {

                return (
                    viewsB -
                    viewsA
                );

            }


            /*
             * Sort order
             */

            const sortA =
                Number(a.sort_order || 0);

            const sortB =
                Number(b.sort_order || 0);


            if (
                sortA !== sortB
            ) {

                return (
                    sortA -
                    sortB
                );

            }


            /*
             * Newest
             */

            return (
                new Date(b.created_at || 0) -
                new Date(a.created_at || 0)
            );

        }
    );

}


/* =========================================================
   APPLY FILTER
========================================================= */

function applyFilter() {

    let filtered =
        allProducts.filter(
            matchesCategory
        );


    /*
     * Trending
     */

    if (
        currentCategory.toLowerCase() ===
        "trending"
    ) {

        filtered =
            sortTrending(filtered);

    }


    /*
     * Search
     */

    const searchTerm =
        searchInput.value
            .trim()
            .toLowerCase();


    if (searchTerm) {

        filtered =
            filtered.filter(
                (product) => {

                    const searchableText =
                        [
                            product.name,
                            product.description,
                            product.category_name,
                            product.category
                        ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    return searchableText.includes(
                        searchTerm
                    );

                }
            );

    }


    renderProducts(filtered);

}


/* =========================================================
   SET HEADING
========================================================= */

function setHeading() {

    if (
        currentCategory.toLowerCase() ===
        "trending"
    ) {

        categoryTitle.textContent =
            "Trending";

        categoryDescription.textContent =
            "Discover the products getting the most attention.";

        document.title =
            "Trending | VNR CHOICEZ";

        return;

    }


    /*
     * Find correct category name
     */

    const category =
        Array.from(
            categoryMap.values()
        ).find(
            (item) =>
                item.name.toLowerCase() ===
                currentCategory.toLowerCase()
        );


    if (category) {

        currentCategory =
            category.name;

    }


    categoryTitle.textContent =
        currentCategory;


    categoryDescription.textContent =
        `Explore our picks from ${currentCategory}.`;


    document.title =
        `${currentCategory} | VNR CHOICEZ`;

}


/* =========================================================
   CLICK TRACKING
========================================================= */

async function trackClick(productId) {

    try {

        /*
         * Ambil current clicks dahulu
         * kemudian tambah 1.
         */

        const {
            data,
            error
        } =
            await supabaseClient
                .from("products")
                .select("clicks")
                .eq("id", productId)
                .single();


        if (error) {

            console.warn(
                "VNR CHOICEZ: Unable to read click count.",
                error
            );

            return;

        }


        const currentClicks =
            Number(data?.clicks || 0);


        await supabaseClient
            .from("products")
            .update({
                clicks:
                    currentClicks + 1
            })
            .eq("id", productId);


    } catch (error) {

        console.warn(
            "VNR CHOICEZ: Click tracking failed.",
            error
        );

    }

}


/* =========================================================
   SEARCH EVENT
========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        applyFilter();

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initializePage() {

    try {

        /*
         * Set heading immediately
         * supaya tidak stuck "Loading..."
         */

        categoryTitle.textContent =
            currentCategory;


        await loadCategories();


        setHeading();


        buildNavigation();


        await loadProducts();


    } catch (error) {

        console.error(
            "VNR CHOICEZ: INIT ERROR:",
            error
        );


        categoryTitle.textContent =
            currentCategory;


        productGrid.innerHTML = `
            <div class="error-message">
                Something went wrong while loading this page.<br>
                ${escapeHtml(
                    formatSupabaseError(error)
                )}
            </div>
        `;

    }

}


/* =========================================================
   START
========================================================= */

initializePage();

</script>

</body>
