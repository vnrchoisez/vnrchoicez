<script>
"use strict";


/* =========================================================
   SUPABASE CHECK
========================================================= */

if (
    typeof window.supabase === "undefined" ||
    typeof supabaseClient === "undefined"
) {
    throw new Error(
        "VNR CHOICEZ: Supabase library/config.js failed to load."
    );
}


/* =========================================================
   DOM
========================================================= */

const categoryNav =
    document.getElementById("categoryNav");

const categoryTitle =
    document.getElementById("categoryTitle");

const categoryDescription =
    document.getElementById("categoryDescription");

const productGrid =
    document.getElementById("productGrid");

const searchInput =
    document.getElementById("searchInput");

const aboutItem =
    document.getElementById("aboutItem");

const trendingLink =
    document.getElementById("trendingLink");


/* =========================================================
   URL
========================================================= */

const urlParams =
    new URLSearchParams(window.location.search);

const requestedType =
    urlParams.get("type") || "Gadget & Tech";


/* =========================================================
   STATE
========================================================= */

let currentCategory =
    requestedType;

let allProducts = [];

let categories = [];

let categoryMap = new Map();


/* =========================================================
   ERROR FORMATTER
========================================================= */

function formatSupabaseError(error) {

    if (!error) {
        return "Unknown Supabase error.";
    }

    return (
        error.message ||
        error.details ||
        error.hint ||
        JSON.stringify(error)
    );
}


/* =========================================================
   SLUGIFY
========================================================= */

function slugify(value) {

    return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   LOAD CATEGORIES
========================================================= */

async function loadCategories() {

    const {
        data,
        error
    } = await supabaseClient
        .from("categories")
        .select("id,name,slug")
        .order("name", { ascending: true });


    if (error) {

        console.error(
            "VNR CHOICEZ: Failed to load categories:",
            error
        );

        throw error;

    }


    /*
     * IMPORTANT:
     * Deduplicate categories by BOTH slug AND name.
     *
     * This guarantees that one category will only
     * appear once in the navigation.
     */

    const uniqueCategories = new Map();


    (data || []).forEach((category) => {

        const cleanName =
            String(category.name || "")
                .trim();

        const cleanSlug =
            String(
                category.slug ||
                slugify(cleanName)
            )
            .trim()
            .toLowerCase();


        if (!cleanName) {
            return;
        }


        const uniqueKey =
            cleanSlug || cleanName.toLowerCase();


        if (!uniqueCategories.has(uniqueKey)) {

            uniqueCategories.set(
                uniqueKey,
                {
                    ...category,
                    name: cleanName,
                    slug: cleanSlug
                }
            );

        }

    });


    categories =
        Array.from(
            uniqueCategories.values()
        );


    categoryMap.clear();


    categories.forEach((category) => {

        categoryMap.set(
            category.slug ||
            slugify(category.name),
            category
        );

    });

}


/* =========================================================
   BUILD NAVIGATION
========================================================= */

function buildNavigation() {

    /*
     * Remove ONLY dynamically generated
     * category navigation items.
     */

    categoryNav
        .querySelectorAll(
            "li[data-category-link]"
        )
        .forEach((item) => {

            item.remove();

        });


    /*
     * Keep About Us exactly once.
     */

    const about =
        document.getElementById("aboutItem");


    /*
     * Extra protection:
     * remove any existing duplicate category
     * links that might have been left in DOM.
     */

    const renderedKeys =
        new Set();


    categories.forEach((category) => {

        const name =
            String(category.name || "")
                .trim();

        const slug =
            String(
                category.slug ||
                slugify(name)
            )
            .trim()
            .toLowerCase();


        if (!name) {
            return;
        }


        const uniqueKey =
            slug || name.toLowerCase();


        /*
         * FINAL duplicate protection.
         */

        if (renderedKeys.has(uniqueKey)) {
            return;
        }


        renderedKeys.add(uniqueKey);


        const li =
            document.createElement("li");

        li.setAttribute(
            "data-category-link",
            "true"
        );


        const a =
            document.createElement("a");


        a.href =
            `category.html?type=${encodeURIComponent(name)}`;


        a.textContent =
            name;


        /*
         * Active category
         */

        if (
            currentCategory
                .trim()
                .toLowerCase() ===
            name.toLowerCase()
        ) {

            a.classList.add("active");

        }


        li.appendChild(a);


        categoryNav.insertBefore(
            li,
            about
        );

    });


    /*
     * Trending active state
     */

    if (
        currentCategory
            .trim()
            .toLowerCase() ===
        "trending"
    ) {

        trendingLink.classList.add("active");

    }

}


/* =========================================================
   IMAGE URL
========================================================= */

function getImageUrl(product) {

    if (
        product.image_url &&
        /^https?:\/\//i.test(
            product.image_url
        )
    ) {

        return product.image_url;

    }


    if (product.image_path) {

        const {
            data
        } =
            supabaseClient
                .storage
                .from("product-images")
                .getPublicUrl(
                    product.image_path
                );


        return data?.publicUrl || "";

    }


    return "";

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(products) {

    productGrid.innerHTML = "";


    if (!products.length) {

        productGrid.innerHTML = `
            <div class="empty-message">
                No products found in this category.
            </div>
        `;

        return;

    }


    products.forEach((product) => {

        const card =
            document.createElement("article");

        card.className =
            "product-card";


        const imageUrl =
            getImageUrl(product);


        const imageHTML =
            imageUrl
                ? `
                    <img
                        src="${escapeHtml(imageUrl)}"
                        alt="${escapeHtml(product.name)}"
                        loading="lazy"
                        onerror="this.style.display='none';"
                    >
                  `
                : "";


        card.innerHTML = `

            <div class="product-image">
                ${imageHTML}
            </div>

            <div class="product-info">

                <div class="product-category">
                    ${escapeHtml(
                        product.category_name ||
                        product.category ||
                        "Product"
                    )}
                </div>

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div class="product-description">
                    ${escapeHtml(
                        product.description ||
                        "No description available."
                    )}
                </div>

                <div class="product-bottom">

                    <div class="product-price">
                        RM ${Number(
                            product.price || 0
                        ).toFixed(2)}
                    </div>

                    <a
                        class="shopee-btn"
                        href="${escapeHtml(
                            product.affiliate_url ||
                            product.shopee_link ||
                            "#"
                        )}"
                        target="_blank"
                        rel="noopener noreferrer"
                        data-product-id="${escapeHtml(
                            product.id
                        )}"
                    >
                        VIEW ON SHOPEE
                    </a>

                </div>

            </div>

        `;


        const shopeeButton =
            card.querySelector(
                ".shopee-btn"
            );


        if (
            shopeeButton &&
            product.id
        ) {

            shopeeButton.addEventListener(
                "click",
                () => {

                    trackClick(
                        product.id
                    );

                }
            );

        }


        productGrid.appendChild(card);

    });

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {

    productGrid.innerHTML = `
        <div class="loading">
            Loading products...
        </div>
    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("products")
            .select(`
                id,
                category,
                category_id,
                name,
                price,
                shopee_link,
                affiliate_url,
                image_url,
                image_path,
                description,
                is_trending,
                featured,
                views,
                clicks,
                sort_order,
                status,
                created_at,
                updated_at
            `)
            .eq("status", "published");


    if (error) {

        console.error(
            "VNR CHOICEZ: Failed to load products:",
            error
        );


        productGrid.innerHTML = `
            <div class="error-message">
                Failed to load products.<br>
                ${escapeHtml(
                    formatSupabaseError(error)
                )}
            </div>
        `;

        return;

    }


    allProducts =
        (data || []).map((product) => {

            let categoryName =
                product.category || "";


            if (product.category_id) {

                const category =
                    categories.find(
                        (item) =>
                            item.id ===
                            product.category_id
                    );


                if (category) {

                    categoryName =
                        category.name;

                }

            }


            return {
                ...product,
                category_name:
                    categoryName
            };

        });


    applyFilter();

}


/* =========================================================
   CATEGORY MATCH
========================================================= */

function matchesCategory(product) {

    if (
        currentCategory
            .trim()
            .toLowerCase() ===
        "trending"
    ) {

        return true;

    }


    const selected =
        currentCategory
            .trim()
            .toLowerCase();


    const productCategory =
        String(
            product.category_name ||
            product.category ||
            ""
        )
        .trim()
        .toLowerCase();


    return (
        productCategory ===
        selected
    );

}


/* =========================================================
   SORT TRENDING
========================================================= */

function sortTrending(products) {

    return [...products].sort(
        (a, b) => {

            const featuredA =
                a.featured ? 1 : 0;

            const featuredB =
                b.featured ? 1 : 0;


            if (
                featuredA !==
                featuredB
            ) {

                return (
                    featuredB -
                    featuredA
                );

            }


            const clicksA =
                Number(a.clicks || 0);

            const clicksB =
                Number(b.clicks || 0);


            if (
                clicksA !==
                clicksB
            ) {

                return (
                    clicksB -
                    clicksA
                );

            }


            const viewsA =
                Number(a.views || 0);

            const viewsB =
                Number(b.views || 0);


            if (
                viewsA !==
                viewsB
            ) {

                return (
                    viewsB -
                    viewsA
                );

            }


            const sortA =
                Number(a.sort_order || 0);

            const sortB =
                Number(b.sort_order || 0);


            if (
                sortA !==
                sortB
            ) {

                return (
                    sortA -
                    sortB
                );

            }


            return (
                new Date(
                    b.created_at || 0
                ) -
                new Date(
                    a.created_at || 0
                )
            );

        }
    );

}


/* =========================================================
   APPLY FILTER
========================================================= */

function applyFilter() {

    let filtered =
        allProducts.filter(
            matchesCategory
        );


    if (
        currentCategory
            .trim()
            .toLowerCase() ===
        "trending"
    ) {

        filtered =
            sortTrending(
                filtered
            );

    }


    const searchTerm =
        searchInput.value
            .trim()
            .toLowerCase();


    if (searchTerm) {

        filtered =
            filtered.filter(
                (product) => {

                    const searchableText =
                        [
                            product.name,
                            product.description,
                            product.category_name,
                            product.category
                        ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    return searchableText
                        .includes(
                            searchTerm
                        );

                }
            );

    }


    renderProducts(
        filtered
    );

}


/* =========================================================
   SET HEADING
========================================================= */

function setHeading() {

    if (
        currentCategory
            .trim()
            .toLowerCase() ===
        "trending"
    ) {

        categoryTitle.textContent =
            "Trending";

        categoryDescription.textContent =
            "Discover the products getting the most attention.";

        document.title =
            "Trending | VNR CHOICEZ";

        return;

    }


    const category =
        categories.find(
            (item) =>
                item.name
                    .trim()
                    .toLowerCase() ===
                currentCategory
                    .trim()
                    .toLowerCase()
        );


    if (category) {

        currentCategory =
            category.name;

    }


    categoryTitle.textContent =
        currentCategory;


    categoryDescription.textContent =
        `Explore our picks from ${currentCategory}.`;


    document.title =
        `${currentCategory} | VNR CHOICEZ`;

}


/* =========================================================
   CLICK TRACKING
========================================================= */

async function trackClick(productId) {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("products")
                .select("clicks")
                .eq("id", productId)
                .single();


        if (error) {

            console.warn(
                "VNR CHOICEZ: Unable to read click count.",
                error
            );

            return;

        }


        const currentClicks =
            Number(
                data?.clicks || 0
            );


        await supabaseClient
            .from("products")
            .update({
                clicks:
                    currentClicks + 1
            })
            .eq("id", productId);


    } catch (error) {

        console.warn(
            "VNR CHOICEZ: Click tracking failed.",
            error
        );

    }

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        applyFilter();

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initializePage() {

    try {

        categoryTitle.textContent =
            currentCategory;


        await loadCategories();


        setHeading();


        buildNavigation();


        await loadProducts();


    } catch (error) {

        console.error(
            "VNR CHOICEZ: INIT ERROR:",
            error
        );


        categoryTitle.textContent =
            currentCategory;


        productGrid.innerHTML = `
            <div class="error-message">
                Something went wrong while loading this page.<br>
                ${escapeHtml(
                    formatSupabaseError(error)
                )}
            </div>
        `;

    }

}


/* =========================================================
   START
========================================================= */

initializePage();

</script>
